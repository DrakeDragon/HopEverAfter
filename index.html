function resolveBiome(o,h){
  if(typeof o==='string') return o[0]==='~' ? (()=>{ const p=o.slice(1).split(',').map(Number); return hx(h+p[0],p[1],p[2]); })() : o;
  if(Array.isArray(o)) return o.map(v=>resolveBiome(v,h));
  if(o&&typeof o==='object'){ const r={}; for(const k in o) r[k]=resolveBiome(o[k],h); return r; }
  return o;
}

function makeRealm(row,idx){
  const [name,emoji,biome,hue,chain,boss,kind,taunt,blurb]=row.split('|');
  const h=+hue, B=resolveBiome(BIOMES[biome],h), R=mulberry32(900+idx*31);
  const cols=(dh,s,l)=>hx(h+dh,s,l);
  const feats={}; for(const k in B.feats) feats[k]=Math.max(0,+(B.feats[k]*(.8+R()*.45)).toFixed(2));

  if(kind==='caster') pal={cloak:[cols(0,55,34),cols(0,55,11)],skin:['#ffe0d0','#d8b0e0','#bfe0c8','#f0d0a0'][idx%4],hat:['witch','crown','horns'][idx%3],hatC:[cols(20,60,22),'#ffd34a'],orb:cols(40,95,62)};
  else if(kind==='brute') pal={skin:[cols(60,35,50),cols(10,30,52),cols(-30,25,45)][idx%3],cloth:[cols(0,35,32),cols(0,35,12)],ears:(idx%3===0?'wolf':'none'),eye:['#ffe066','#ff4040','#ffffff'][idx%3]};
  else if(kind==='dragon') pal={body:[cols(0,60,48),cols(0,60,14)],belly:cols(40,80,70),wing:cols(0,55,30),eye:'#ffe066'};
  else pal={body:[cols(0,60,62),cols(0,60,20)],eye:['#ffe066','#ffffff','#2a0a4a'][idx%3],tent:idx%2,crown:(idx%3===1?1:0)};
  const bn=boss.replace(/^The /,'the ');
  return { id:'g'+idx, name, emoji, hue:h, blurb:blurb||'', story:'', twist:B.twist,
    sky:B.sky, cel:B.cel&&B.cel.k==='ring'?{k:'ring',c:cols(0,50,70)}:B.cel, stars:B.stars, hills:B.hills, decor:B.decor, plat:B.plat, haz:B.haz, low:hex2rgb(B.low), feats, amb:B.amb,

}

/* ===== THE HUNDRED PAGES: a novel in 100 short chapters ===== */
const NOVEL = {
title:'The Hundred Pages',
prologue:[
`Long ago, before maps and mailboxes, there was a Book with one hundred pages, and every page was a whole world. The Great Book of Tales held every story ever told, and every story was alive.`,
`Now someone is stamping THE END across the pages, one by one. The tales are freezing in the middle of a sentence. Only one small girl can still cross from page to page. She lives in the margins, where nobody looks. Her name is Wren, and she is about to fall off the edge of the world.`
],
ch:[
// 1
['The Girl in the Margin',
`Wren lived in the margin of a page, between a drawing of a teapot and a coffee stain. Nobody had ever written her into a story. So she doodled herself a hat and kept busy. Today the page shuddered. Ink rolled across it like a black tide, and the ink spelled THE END. Wren slipped off the edge of the paper and landed on a path made of cookie crumbs. A tiny gingerbread voice said, "Oh good. A snack with legs."`,
`The Witch of the Gingerbread House had been frozen mid-cackle for a hundred years, and Wren hopped her out of it. The stove lit, the sugar thawed, and the whole house sighed like a held breath. Crumb, the smallest gingerbread boy in the world, hopped onto Wren's hat. "Free ride," he said. "I'm calling it." The ink on the horizon was still spreading. Beyond the candy-cane trees, a beanstalk was creaking.`],
// 2
['Up the Beanstalk',
`The beanstalk was taller than the sky and twice as rude. Every leaf was a platform and every platform wobbled. "Don't look down," said Crumb, who was looking down. Wren hopped from leaf to leaf, collecting golden beans that rattled like tiny bells. Above the clouds a voice rumbled, "Fee, fi, fo, FREEZE." The Giant stood in his castle doorway, one foot raised, stuck mid-stomp.`,
`The Giant's stomp finally came down, and it landed on nothing but a cloud pillow. He blinked. He was lonely, not mean, and he had been stuck in a very bad day. A harp in the corner began to play on its own. "The ink tastes like erasers," the Giant grumbled. "Whoever is doing this has a terrible sense of story." Wren agreed, and the beanstalk lowered her to a mountain that was made entirely of glass.`],
// 3
['Glass Mountain',
`Everything on Glass Mountain was slippery, even the compliments. Wren hopped across ice ledges that cracked beneath her boots. The wind sang a lullaby so soft that Crumb fell asleep on her hat and had to be poked. At the peak sat the Snow Queen on a throne of frost. She had been furious since the first snowfall, and the Hush had frozen her in the middle of a scowl.`,
`The Snow Queen's ice broke with a sound like applause. Underneath, she looked tired, and a little embarrassed. "I only wanted people to stop leaving," she admitted. Wren thought of the margin, and how quiet it was, and said, "I know." A snowflake the size of a plate landed on her sleeve and spelled a word in tiny letters: HUSH. The Queen paled. "That is no weather," she said. "That is an author."`],
// 4
['The Piper Who Stopped',
`The town of Hamelin was silent. Not quiet, but silent, like a song with the notes removed. Rats sat still on the rooftops, and children stood like statues on the cobblestones. Wren hopped from chimney to chimney while Crumb whistled nervously. In the market square the Pied Piper held his pipe to his lips and did not move a muscle. The music had stopped, and so had everyone who loved it.`,
`When the Piper's note finally rang out, the whole town exhaled. Rats pattered home, children laughed, and the baker dropped a tray of bread with joy. "Somebody pinched the last page of my story," the Piper said, bewildered. "I was told I'd never finish my tune." Wren tucked a little silver whistle into her pocket. As the town woke, the wind carried a smell of roses and a hundred years of dust toward a castle on the hill.`],
// 5
['The Hundred Year Nap',
`A hedge of thorns had grown around the Sleeping Castle, thick as a wall and sharp as a rumor. Wren hopped from briar to briar, apologizing to each one. Inside, the whole court slept: the cook with a spoon in the air, the guards leaning on spears, the cat mid-yawn. In the tallest tower a sorceress wove thorns from spun starlight. She had been told she was never invited, and she was still angry about it.`,
`The Thorn Sorceress dropped her spindle. "It was a very small party," she muttered. "I would have brought a gift." Wren found the invitation list, and her name was at the top in a hand she almost recognized. The castle stirred. The sleeping princess opened her eyes and asked, "Is it morning?" Crumb answered for everyone: "It is, and it has been rude to you for a century." A trail of tiny hoofprints led down the hill toward some straw, sticks and bricks.`],
// 6
['Three Little Hills',
`Three pigs, three houses, and one very winded wolf. The straw house was a trampoline, the stick house was a ladder, and the brick house was a wall you could hop over if you believed in yourself. Wren believed in it a little. The pigs were frozen in the middle of a very fast sprint, and the Big Bad Wolf stood with his cheeks puffed out, ready to blow, unable to exhale.`,
`The Wolf breathed out at last, and it knocked over only a single wind chime. "I was getting a headache," he confessed. The pigs, unfrozen, were already arguing over who got to hug Wren first. Crumb was offered a very small slice of pie. In the brick house's window sat a book with its pages blank, and on the first page, in black ink: Chapter Seven. The woods behind it had gone very dark.`],
// 7
['Moonfang',
`Wolf Woods did not like to be looked at, so Wren kept her eyes on the next stump. Eyes glittered in every shadow, but not one of them blinked. The whole pack was frozen, and the moon hung stuck at the top of the sky like a coin on a string. At the heart of the woods stood Moonfang, the Alpha, mid-howl, mouth open wide as a cave.`,
`Moonfang's howl finally rolled across the trees, and the real moon swung loose and went on its way. The pack bowed their great heads. "We were never the villains," Moonfang said. "We were the part where the tale gets scary, and then it gets to be over." Wren knelt and put out a hand, and the Alpha licked it once. Across the trees a mirror was flashing in the sunrise, calling, calling, calling her by a name that was not hers.`],
// 8
['Mirror, Mirror',
`The Mirror Court was made of a thousand mirrors, and in each one Wren saw a different girl: one with a crown, one with a sword, one with a name. She hopped past them quickly. Crumb hid his eyes. At the center of the court the Magic Mirror hung in a gilded frame, and its face was frozen in a smile exactly like a question. "Who is the fairest?" it asked. It had been asking for a hundred years.`,
`The Magic Mirror cracked once, then settled, and its answer came out gentle. "The fairest is whoever stops asking," it said. Wren stared at the one mirror where she was just Wren, small and plain and real. "That is the first time anyone has shown me myself," she said. In the glass, behind her reflection, a tall shape with black ink fingers raised a quill and wrote a single word. Then the glass went cloudy, and the word was gone.`],
// 9
['A Name in the Mine',
`Deep inside Rumpel's Mine the walls glittered with gold that was really just very shiny straw. Wren hopped from cart to cart while rocks tumbled and echoes giggled. In the deepest cavern a little man stood on one foot beside a spinning wheel, frozen in mid-dance. "Guess my name!" he was shouting at no one. The echo shouted it back, again and again.`,
`"Rumpelstiltskin," Wren said, because the sign on the wheel said so, and the little man sagged with relief. "Nobody ever remembers it," he sniffled. "They just say it's a funny word." Wren, who had no story and so no name anyone used, felt a pinch behind her ribs. "I'll remember," she promised. "Names matter." He pressed a golden spindle into her hand. "Then take this. The wheel remembers the thread that pulls the whole Book together."`],
// 10
['The Mountain Drake',
`Dragon's Peak steamed like a teapot, and Ember, the Mountain Drake, curled around the summit like a cat on a warm stove. Her scales shimmered with every color of sunset. She was frozen with her wings half open, a flame half breathed. Wren hopped across hot stone steps and flaming ledges, and Crumb muttered that he was too delicious for this altitude.`,
`When the last flame left Ember's mouth, it lit a hundred lanterns across the valley. The Drake lowered her great head. "I have been asleep with my eyes open," she said. "A hand of black ink pinned me here, and it left a page in my hoard." She slid it across the stones. It read: ONE HUNDRED PAGES. ONE HUNDRED ENDINGS. SIGNED, THE HUSH. Wren folded it carefully. "Then we find the other ninety," she said, and Ember offered a wing to the next world.`]
,
// 11
['The Kraken Queen',
`Mermaid Lagoon glittered under a moon that never set, because the Hush had stopped the tide halfway. Wren hopped across bobbing platforms and drifting lily pads while seabirds hung motionless in the air. Under the water, a crown of tentacles rose: the Kraken Queen, ruler of the deep, frozen with her arms out like she was about to hug the world.`,
`The tide rolled in, and the Kraken Queen laughed a bubbly laugh. She had only ever wanted somebody to say hello. A small mermaid surfaced and handed Wren a pearl the size of a plum. "Take it," she said. "The pearl remembers every word spoken near it." Crumb leaned in to listen and heard a faint whisper from a faraway place: shhhh. Wren looked up. The next realm smelled of paper, ink and dust, and it was full of books.`],
// 12
['The Library of Tales',
`The Library of Tales was alive. Shelves slid, ladders danced, and the books flapped like startled birds. Wren hopped from one flying volume to the next while a very small voice said, "Mind the grammar!" It belonged to a raven in spectacles perched on a lectern. "I am Quill," he announced. "Proofreader of the Great Book. And you are in the margin, which is technically illegal." At the end of the hall the Head Librarian rose, finger pressed to her lips.`,
`The Head Librarian's "Shhhh" finally ran out of air, and the books settled like tired pigeons. Quill hopped onto Wren's other shoulder, straightened his spectacles, and sighed. "I should tell you about the Hush. He used to be one of us." A hush fell over the library, and this time it was an honest one. "Come," said Quill. "The Orchard is next. And please, no biting the apples."`],
// 13
['The Poison Apple',
`The Poison Apple Orchard smelled sweeter than a bakery and meaner than a dentist. Apples rolled down every slope like tiny red boulders, and the crows kept score. Wren hopped from branch to crumbling branch while Quill read warnings aloud. The Evil Queen stood at the top of the grove, one hand reaching for a mirror that was not there, her face locked in a perfect, terrible smile.`,
`The Evil Queen's smile cracked. For a moment she looked ordinary and sad, a person who only wanted to be told she was enough. "Tell the mirror I said sorry," she whispered, and handed Wren a single green apple. "It is not poisoned," she added. "I checked." Crumb sniffed it suspiciously. A white duck waddled out of the reeds, gave Wren an extremely disappointed look, and led them to a pond.`],
// 14
['The Ugly Duckling',
`Ugly Duckling Pond rippled with reflections of things that were not quite there. Lily pads drifted by, dragonflies buzzed like tiny helicopters, and the water was full of strange light. A small gray duckling sat alone in the reeds. Behind him loomed the Swamp Troll, mid-sneer, mid-laugh, his club raised, because the Hush had frozen him exactly at the cruelest moment.`,
`The Swamp Troll's club clattered onto the lily pads, and he sat down heavily. "Everyone expects me to be rude," he muttered. "It is exhausting." The duckling looked at his reflection and saw something white and graceful unfolding. Wren hopped back and pretended not to cry. "You were never ugly," she told him. "You were early." The swan stretched his wings and pointed with one of them toward a bridge, a very old bridge.`],
// 15
['Trip, Trap',
`The bridge went trip-trap, trip-trap, whether anyone walked on it or not. Three billy goats stood at the foot of it, frozen mid-gallop. Under the planks, the Bridge Troll waited, his single yellow eye wide open, his mouth full of unspoken threats. Wren hopped across sliding planks while boulders tumbled and Quill read the toll sign out loud: "Pay or hop."`,
`"I am a very reasonable troll," said the Bridge Troll, as Wren landed on the far shore. "All I ever asked for was a polite hello and maybe a snack." The first goat said hello. The second brought a snack. The third butted him gently into the river, and everyone agreed it was a fair trade. A tiny voice from a tulip said, "Excuse me. Do you have a thumb I could borrow?"`],
// 16
['Thumbelina',
`Thumbelina's Meadow was a jungle to anyone less than a thumb tall, and Wren, who had been feeling small lately, felt right at home. Petals bounced like trampolines. Dandelion fluff carried her up on warm breezes. At the end of a long tunnel under the roots sat the Mole King on a throne of mud, frozen mid-proposal, a ring of gold in one velvet paw.`,
`The Mole King blinked in the sunlight and sneezed. "I only wanted somebody to share the dark with," he said. Thumbelina, who was exactly as tall as a thumb, politely refused the ring and offered him a tulip instead. The swallow who had carried her on his back nodded. "Weddings are best when both people say yes," he said. A carpet unrolled in the sky, woven with a hundred lamps, and a smell of cinnamon drifted down.`],
// 17
['One Thousand and One',
`Arabian Nights Bazaar glittered with lamps, spices and carpets that really did fly. Wren hopped across rooftops while merchants frozen in mid-haggle shouted prices at the sky. Crumb tried to eat a sample of saffron cake and was gently, firmly stopped by Quill. In the grandest tent of all, the Grand Vizier sat with his fingertips together, a lamp in front of him, and a wish on his lips he had never finished.`,
`The Grand Vizier's wish came out all at once, and it was embarrassingly small: he wanted a little more time to finish his tea. The genie rolled his eyes, loudly, and granted it. "Scheherazade's secret," the Vizier admitted, "is that every story is a way of staying alive another night." Wren wrote that in her heart. Far to the north, an arrow flashed across the sky and stuck in a green oak tree.`],
// 18
['Merry Outlaws',
`Robin's Greenwood was the sort of place where every tree had a secret. Wren hopped from swaying branch to swaying branch while arrows whizzed past, each one halted in mid-air as if the sky were holding its breath. Under the great oak stood the Sheriff with a very long scroll of taxes, his foot on a treasure chest, his face the color of an overripe plum.`,
`The Sheriff's scroll unrolled for what felt like a mile, and then, with a shrug, he signed it: "Taxes cancelled. Sorry." The merry band cheered, and Robin of the Wood tipped his hat to Wren. "Anyone who hops like that is always welcome in Sherwood," he said. In the roots of the oak lay a golden ball, round and warm, and a very deep well sat patiently behind it, waiting for someone to look in.`],
// 19
['The Well Witch',
`The Frog Prince's Well was a very deep, very green place. Lily stones vanished underfoot and reappeared ten steps later, as though the well were teasing. Moss hung in curtains, and somewhere below, a frog sat on a golden ball, waiting. The Well Witch rose from the water in a spiral of bubbles, frozen mid-incantation. "Kiss the frog!" she began, and then she could not finish the sentence.`,
`The Well Witch's sentence finally ended, and it was much kinder than the start. "Kiss the frog," she said, "or just tell him you like his croak." Wren, who was no fan of kissing, told the frog she liked his croak. He turned into a prince out of sheer surprise. "I don't think I ever stopped being a frog," he said, and shook her hand. The shelves of a far-off shop began to rattle with toy soldiers.`],
// 20
['Tin Hearts',
`In the Tin Soldier Toy Shop, the lights were out and the toys were awake. Wren hopped across shelves with wind-up cars rolling under her feet and bouncing balls ricocheting over her head. The Tin Soldier stood at the edge of a windowsill with a paper ballerina, frozen mid-salute. In the box beside them the Jack-in-the-Box sprang up with a wild cackle, stuck mid-pop, unable to go back down.`,
`The Jack-in-the-Box finally popped back into his box, and the lid closed with a satisfied click. "Best nap of my life," he said, muffled. The Tin Soldier handed Wren a thin red ribbon. "Tin hearts can march anywhere," he told her. "Even into a story that is not ours." Crumb, who had been quiet for at least a minute, said what everyone was thinking: "That was the tenth world of the second Book, and the Hush hasn't even shown his face yet."`],
// 21
['Sugarplum Night',
`It was Christmas Eve in the Nutcracker's Land, and the whole kingdom was made of sugar. Candy springs bounced under Wren's boots, and sugar-glass slabs flickered like fireflies. The nutcracker prince lay frozen in mid-battle, sword raised, while the Mouse King loomed over him with seven crowned heads, each stuck in a different expression of triumph.`,
`The Mouse King's seven heads argued for a full minute about who should speak. Finally the smallest one said, "We just wanted cheese." The prince sheathed his sword and fetched a wheel from the pantry, and the war ended in a snack. Quill took notes. "In the Book," he said, "this is called an unexpected resolution." Crumb said, "In my family, we call it lunch." Up ahead, a tower with no door gleamed in the moonlight.`],
// 22
['Let Down Your Hair',
`Rapunzel's Tower had no door and no stairs, only a braid so long it went around the moon twice. Wren hopped up on drifting ledges and gusts of wind while doves cooed warnings. At the very top, the Enchantress stood with a pair of shears, frozen in the middle of the world's most dramatic haircut. Beside her, Rapunzel gazed out of the window at a world she had only seen in pictures.`,
`The Enchantress put down her shears, and her face softened. "I only wanted to keep her safe," she said. "I forgot that safe and kept are two different words." Rapunzel climbed down her own braid to the meadow, and the tower, finally relieved, crumbled into pretty pebbles. Wren turned the words over in her head. Safe, and kept. Far overhead, a storm was turning the sky the color of a bruise.`],
// 23
['Thunder Peak',
`Thunder Peak rumbled under Wren's boots. The wind came in gales, the clouds were slabs of gray stone, and the lightning birds screamed through the sky. Wren rode the updrafts while Quill clung to her collar, muttering about wing damage. At the summit the Storm Dragon coiled around a pillar of crackling light, frozen mid-roar, the sky stuck half-flashed behind him.`,
`The Storm Dragon's roar rolled out across the clouds, and the sky finally finished its flash. Rain came down in blessed sheets. "I get cranky when I am held back," he rumbled. "Everyone does." He lowered his head and let Wren scratch the scale between his eyes. A silver ink-drop sat in it. "He touched me," the Dragon whispered. "The Hush. He is not what he was." Wren tucked the drop into the pearl. The next page was a street full of music.`],
// 24
['The Emperor Has Clothes',
`Emperor's Parade was the loudest quiet place Wren had ever seen. Banners fluttered, trumpets gleamed, and the crowd stood perfectly still, frozen mid-cheer. Wren hopped across floats and ribbons while Quill whispered that all of it was a delicate lie. At the head of the procession the Vain Emperor stood in his underwear, one hand raised to wave, the whole kingdom too polite to say what everyone could see.`,
`A small child at the edge of the crowd, finally unfrozen, said it first: "He has nothing on!" The Emperor looked down. He turned the color of a boiled beet. Then, to everyone's surprise, he laughed, wrapped himself in a curtain, and led the parade anyway. "A person can be ridiculous and kind," he said. A wooden puppet's laughter drifted in on the breeze, and it sounded suspiciously like nose.`],
// 25
['Strings',
`Pinocchio's Workshop was full of sawdust, half-finished toys and one very dramatic cricket. Wren hopped across shelves, saws and spinning gears while wooden birds clacked overhead. At the workbench stood the Puppet Master, with strings coiling from his fingers to every living thing in the shop, frozen in the very instant of tightening them.`,
`The Puppet Master's strings fell loose, and the whole workshop sagged with relief. "I only wanted them to stay safe," he said. A wooden boy stepped forward, nose a little shorter than it had been. "I'd rather be real and tripped than perfect and tied," he said. The cricket, who had been waiting for this moment all chapter, said, "That's what conscience is for." Down the lane, a cat in very tall boots tipped his hat at a manor.`],
// 26
['Boots',
`Puss in Boots Manor had a hundred rooms and a hundred cats, and every one of them judged Wren's footwork. She hopped across banisters, chandeliers and soup tureens while the cats took notes. At the end of the great hall stood the Ogre Count, who could turn into anything. Right now he was a lion, frozen halfway through becoming a mouse, which was awkward for everyone.`,
`The Ogre Count finished becoming a mouse, and Puss, quick as a whisper, said, "Thank you for the demonstration." The Count squeaked, scampered into a mouse-hole, and decided to keep it. The manor belonged to the Marquis of Carabas once more. "My boots," Puss told Wren, "were the best investment of my nine lives." Beyond the gates a donkey, a hound, a cat and a rooster were fighting over a very small stage.`],
// 27
['Band of Four',
`Bremen Town Stage rattled with noise: a donkey's bray, a hound's bark, a cat's yowl, a rooster's crow, all frozen in the most gloriously terrible chord Wren had ever heard. She hopped across the stage-lights and speaker-stacks while Crumb held his ears. The Robber Chief sat in a cabin with a lamp and a stew, frozen mid-gulp, wondering which horrible monster had just kicked down his door.`,
`The Robber Chief ran out of his cabin screaming and has never been seen since. The four animals moved into the house, set the table, and started a band. "We are not as young as we were," the Donkey said, "but we are exactly as loud." Wren tried a note on the little silver whistle, and every animal cheered. In a ballroom far away, twelve pairs of slippers were being worn into dust.`],
// 28
['Dancing Until Dawn',
`In the Dancing Princesses' ballroom, the music never stopped and the floor was always moving. Wren hopped across spinning tiles, drifting chandeliers and rolling candle-sticks while twelve princesses twirled past in a blur. The Midnight King sat at the far end with a gleaming baton, conducting a waltz that could not end, because the Hush had pinned it to the last bar.`,
`The Midnight King lowered his baton, and the twelve princesses collapsed into velvet chairs, laughing. "We only wanted to dance," said the eldest, "but not forever." The King nodded. "Even the best song needs a last note," he said. He bowed to Wren. "Whoever is doing this to the Book does not understand music." Wren, who did, nodded. Outside, geese in golden feathers waddled across a barnyard.`],
// 29
['Golden Goose',
`Golden Goose Farm sparkled so brightly Wren had to hop with her eyes half shut. Everything in the yard shone: the hay, the hens, the duck pond, the pigs. Anyone who touched the goose stuck to it, and a chain of villagers hung from her feathers in a long line, frozen mid-laugh. The Greedy Innkeeper stood at the front, glued to the goose by his own finger, unable to let go.`,
`The Innkeeper let go of the goose at last, and the line of villagers tumbled onto the haystacks in a heap of giggles. "All I wanted was a little more," he said. "That is always the problem with more," said the Goose, who was far wiser than she looked. A tiny tailor waved from the window of a nearby shop. "Seven at one blow!" he called. "Well, flies, mostly."`],
// 30
['Seven at One Blow',
`The Brave Little Tailor's village was made of buttons, thimbles and thread as thick as ropes. Wren hopped across spools and needles while Quill corrected the tailor's grammar from above. Two giants lay frozen mid-fight in the meadow, each with a boulder raised to smash the other, each convinced the tailor had started it. A tiny sign on the tailor's belt read: SEVEN AT ONE BLOW.`,
`The Twin Giants put their boulders down and glared at each other. "He tricked us," said one. "He did," said the other. Then they both started to laugh, and the tailor, perched on a fence, laughed louder. The Book had been taught a lesson: sometimes courage is a good story told at the right time. Wren heard the first rumble of the next Book, the one where the woods go wild, and her heart began to hop.`],
// 31
['The Elves at Night',
`The Elves and the Shoemaker's cottage glowed at night, because the elves worked by moonlight. Wren hopped across workbenches and lasts, past rolls of leather and spools of thread. The elves were frozen mid-stitch, each with a needle raised. The Shoe Thief crouched by the window, one boot in each hand, his grin stuck half-wide.`,
`The Shoe Thief dropped the boots, and the elves let out a cheer so shrill that every glass in the cottage rang. "These are the finest shoes in the Book," the shoemaker said, holding a pair up to the light. "I just wish I had known who made them." Wren pointed at the elves. The shoemaker wept, then made tiny clothes for each of them. Down by the shore, a very old fisherman was shouting at a fish.`],
// 32
['Three Wishes',
`The Fisherman's Sea was rough and full of wishes. Waves rose and fell like breathing, and Wren hopped across drifting driftwood while gulls shrieked above. A golden fish hung in the net, frozen mid-gasp, and the fisherman's wife stood on the shore with a hundred wishes, each one larger than the last. At the horizon, the Storm Flounder loomed, roaring about bigger. BIGGER!`,
`The Storm Flounder shrank to the size of a frying pan and flopped into the shallows. "Enough," the fisherman said quietly, to himself and to the sea. The wife sat down on a rock and looked at the little cottage they already had. "It is a very nice cottage," she admitted. Quill nodded gravely. Over the mountains seven black birds were circling a glass hill, and they were looking for someone.`],
// 33
['Seven Ravens',
`On Seven Ravens Mountain, the wind had feathers. Wren hopped across ledges while seven black birds wheeled overhead, each one a brother turned by a careless curse. The Raven Sorceress stood on the highest crag, a wand of black glass raised, the curse half spoken, her mouth stuck in an O.`,
`The Raven Sorceress finished her sentence, and the curse unspooled backward. Seven boys landed on the snow, shivering and delighted. The littlest still had one wing. "It is a good wing," he said. "I'd rather keep it." The sorceress, ashamed, turned herself into a quiet crow and flapped away. Wren and Crumb looked at each other. Someone, somewhere, was weighing something very small on a golden scale.`],
// 34
['The Princess and the Pea',
`The Pea Princess Palace had a hundred beds stacked to the ceiling, and each one was softer than a cloud. Wren hopped from mattress to mattress as they wobbled beneath her. Somewhere at the bottom was a single, tiny pea. The Mattress King sat on a throne of folded blankets, frozen mid-yawn, mid-sentence: "I could not sleep a wink."`,
`The Mattress King yawned out the end of his sentence and fell fast asleep in his own throne. The princess, who had never once complained, tucked the pea into a jewelry box. "It is a very good pea," she said. "It taught me what I can feel." Crumb, who had been crushed twice by mattresses, said he felt it too. Midnight struck somewhere very far off, and a glass slipper rang like a bell.`],
// 35
['Midnight',
`At Cinderella's Ball every clock showed five to midnight, because the Hush had stopped them there. Chandeliers shivered, violins stuttered, and the dancers hung in the air like paper cut-outs. Wren hopped across the polished floor while Quill muttered about the architecture. The Wicked Stepmother stood at the top of the stairs, one hand raised in a command that could not be finished.`,
`The Wicked Stepmother lowered her hand, and the clocks began to tick again. "I thought if she were not happy," she said, "I might finally get to be." It was the saddest thing Wren had ever heard. Cinderella took the stepmother's hand and walked her down the stairs, slowly, one step at a time, and said, "Dance with me." The last stroke of midnight was a very gentle one. A thin, steady voice called from a cave: "Strike the flint."`],
// 36
['The Tinderbox',
`The Tinderbox Tunnel was a cave of sparks and dark. Wren hopped over crackling cinders and falling stones while three huge dogs with saucer-sized eyes watched from the shadows, each frozen in the act of barking. The Cave Witch sat on a mountain of coins with a tinderbox in her lap, mid-strike, the first spark about to leap from the flint.`,
`The first spark leapt from the flint and lit the cave like a hundred lanterns. The Cave Witch looked at it and gasped. "I forgot it was beautiful," she said. The dogs, whose eyes had been the size of saucers, shrank down to the size of cups, and they wagged their tails. Crumb did a happy little spin. A silk thread caught Wren's sleeve, shining in the lamplight, and led out of the cave.`],
// 37
['Anansi',
`In Anansi's Web every thread hummed a story. Wren hopped across silk strands that bounced and sang while fireflies drifted by like tiny lamps. Spiders the size of bicycles wove tapestries in the dark, and a gourd the size of a house held every tale ever told. Onini the Python coiled around it, mouth wide, frozen at the exact moment of swallowing a story whole.`,
`Onini the Python spat out the story with an enormous cough, and it unrolled across the sky in glittering silk. Anansi, who had been hiding in Wren's hat the entire time, stepped out grinning on all eight legs. "Every story belongs to the spider," he said, "which means every story belongs to everyone." Quill huffed, but he was smiling. The next trail was a very long chicken-legged hut, and it was coming closer.`],
// 38
['The Hut on Chicken Legs',
`Baba Yaga's Hut ran through the forest on its great scaly legs, kicking over saplings. Wren hopped across fences made of bones and lanterns made of skulls, and Crumb whimpered. Inside, the old witch stood stirring a cauldron, mid-stir, mid-cackle, her mortar raised in one hand, a pestle in the other. "Come closer, little hopper," she said, though her lips did not move.`,
`Baba Yaga finished her cackle and sat down heavily on a stool. "Nobody comes to visit," she grumbled. "They only come to be afraid." Wren offered her a very small plate of cookie crumbs. The old witch ate them one by one, then wiped her eyes on her sleeve. "Take this feather," she said. "A bird of fire is hiding in the woods, and it is the only light the Hush cannot put out."`],
// 39
['The Firebird',
`The Firebird Forest glowed from the inside. Every leaf shimmered gold, every pool held a flame, and every shadow was lit from below. Wren hopped over burning logs and cinders while a single feather drifted through the air like a promise. Koschei the Deathless stood on a stone, his chest hollow, his death hidden in a needle in an egg in a duck in a hare in a chest. The Hush had frozen him in the middle of a monologue.`,
`Koschei the Deathless looked at the needle in Wren's fingers, the egg, the duck, the hare, and the chest, and for the first time in a thousand years he sighed. "I am so very tired," he said. The needle broke. He did not die. He simply stopped pretending. The Firebird landed on Wren's shoulder, a living flame, and sang. A single fox tail swished in the dark, then another, then another, nine of them in all.`],
// 40
['Nine Tails',
`The Kitsune Shrine was a thousand red gates, and every gate led to a different forest. Wren hopped across lanterns and torii while fox-fire flickered at her heels. At the last gate sat the Nine-Tailed Shadow, huge, silent and glimmering, frozen in the act of choosing which tail to show. A smaller fox sat beside it, tilting her head. "Which tail is real?" she asked.`,
`"All of them," the Nine-Tailed Shadow said at last, and the gate shuddered open. The fox beside her laughed. "That is the secret. A person can be many things and still be one person." Wren thought of the margin, the doodled hat, the coffee stain. "Then who drew me?" she asked. The fox's smile faded. "Someone with black fingers," she said. "Someone who loved this Book very much."`],
// 41
['The Peach Boy',
`Momotaro's Island floated on a sea of mist, and the peaches on its trees were as big as houses. Wren hopped across rocks while a dog, a monkey and a pheasant followed her trail, frozen mid-march with their dumplings in their paws. At the island's end the Oni King stood on a mountain of stolen treasure, his club raised, his roar stuck in his throat.`,
`The Oni King's roar finally rolled out across the water, and then it dwindled into a sneeze. "Peach pollen," he sniffled. Momotaro handed him a handkerchief. By the time the treasure was returned to the villagers, the Oni had agreed to help carry it. A white rabbit in the moon winked at Wren. "Come up," she called. "We have dumplings, and the pounding is nearly done."`],
// 42
['The Rabbit on the Moon',
`Moon Rabbit Meadow was made of silver grass and floating stones. Wren hopped across moonbeams while mochi cakes bounced along beside her, and a very polite rabbit kept time with a wooden mallet. The Moon Toad squatted at the top of the hill, huge and warty, frozen mid-croak. A crescent of ink hung across his belly like a smile gone wrong.`,
`The Moon Toad croaked the rest of his sentence and plopped into a puddle of starlight. "Moon… mine…" he repeated, and then, more softly, "Moon… shared." The rabbit set down her mallet. "There is enough to go around," she said. Quill nodded. Wren glanced at the pearl, which was warm in her pocket. A glowing girl stepped out of a stalk of bamboo and bowed.`],
// 43
['The Bamboo Girl',
`Kaguya's Bamboo Grove glittered like a hundred green lanterns. Wren hopped from stalk to swaying stalk while moonlight pooled in the leaves. The glowing princess sat on a bamboo throne, as old as sorrow and as young as a newborn, frozen mid-farewell. The Moon Lord floated above her, calm and cold, his hand outstretched, ready to carry her home.`,
`The Moon Lord's hand closed on Wren's, and he looked startled. "You are not from any page I know," he said. "That is the first time anyone has said that kindly," Wren answered. He let Kaguya choose, and she chose to stay one more summer. The moon blinked and went on its way. Wren, far from certain, asked the cold, bright lord a question: "Do you know who drew me?" He gazed at her for a long while. "A boy," he said at last. "With a quill."`],
// 44
['Seventy-Two Tricks',
`The Monkey King's Mountain was steep, loud and deeply smug. Wren hopped across cloud steps and peach trees while the Monkey King somersaulted past her, laughing. Heaven's gates stood at the top, guarded by the Heavenly General in armor of gold. He stood frozen mid-command, a thousand soldiers lined up behind him, every spear tilted toward the cheerful little monkey.`,
`The Heavenly General's order finally echoed through the gates: "Stand down." The Monkey King, who had been waiting for it, put his staff behind his head and grinned. "Seventy-two tricks," he said, "and the best one is knowing when to stop." Wren grinned back. Quill sighed, because the Monkey King had stolen his spectacles. A waterfall roared in the distance, and every fish in the river was trying to climb it.`],
// 45
['Dragon Gate',
`At Dragon Gate Falls the river climbed up instead of down. Fish leapt in silver arcs across the spray, each one trying to reach the top. Wren hopped on the backs of carp while the water thundered. At the lip of the falls the River Dragon hung in the air, enormous and shining, frozen mid-coil, blocking the way with a patience that looked a great deal like cruelty.`,
`The River Dragon uncoiled, and the whole waterfall sparkled. "It was never a test," he said, almost gently. "I was only standing there to tell you that you can do it." A small carp reached the top and became a dragon, then another, then another. Wren asked if she could hop through. The Dragon bowed. "Of course, little one," he said. "Go and tell the Nian Beast it is nearly the new year."`],
// 46
['The Nian Beast',
`In the village of the Nian Beast every window was red, and every lantern was lit. Wren hopped across rooftops while firecrackers popped like tiny thunder and lion dancers swayed in the streets, all frozen mid-step. The Nian Beast stood at the gate, huge and horned, his roar caught in his throat. The Hush had stopped the new year before it could start.`,
`The Nian Beast roared at last, and the whole village roared back. The new year poured in like a river of red and gold. The Beast, it turned out, had only ever wanted to be invited to dinner. "Come in," said the village elder. "It is very loud, and the dumplings are excellent." Wren hopped out of the festival quietly while a tiger-striped shadow stretched across the jungle.`],
// 47
['The Law of the Jungle',
`In Mowgli's Jungle every vine was a bridge and every shadow had eyes. Wren hopped across tree trunks while monkeys screeched overhead, and an elephant stood frozen mid-stomp, waiting for her cue. The Striped Tyrant crouched on a rock, his tail lashing, his claws in the air, hunting a boy who was not there anymore. "The jungle is MINE," he rumbled, again and again.`,
`The Striped Tyrant padded off into the tall grass, thinking. "The jungle belongs to everyone," said the elder wolf. "That is the law." Mowgli, who had come back from the village, grinned at Wren. "You hop like a frog with a plan," he said. "Thank you." Crumb sniffed the air. Dust and desert wind blew from the west, and with it came the sound of a very big, very friendly voice saying, "Howdy."`],
// 48
['Tall Tales',
`Pecos Prairie was bigger than any map could hold. Wren hopped across tumbleweeds, cactus and rolling wagons while a cowboy twirled a rope the size of a river. The Rattlesnake Bandit slithered across the road, frozen mid-draw, a hundred pistols in a hundred rattles. "Reach for the sky, partner," he hissed, and the sky, it seemed, could not.`,
`The Rattlesnake Bandit holstered his rattles. "I am only a snake," he said sadly. "I was told I had to be the bad guy." The cowboys tipped their hats and offered him a job as a rope. He took it. Wren giggled for the first time in days. A single pumpkin rolled across the road, lit from within, grinning as if it knew a secret.`],
// 49
['The Headless Horseman',
`The Sleepy Hollow road was lined with scarecrows that turned to watch Wren go by. She hopped over pumpkins and fence-posts while crows made rude remarks. Behind a covered bridge the Headless Horseman waited on his enormous black steed, his lantern-head in his hand, frozen mid-throw. "Where is my head?" he moaned, and Wren said, "In your hand," which did not help.`,
`The Headless Horseman looked down at the pumpkin in his hand and sighed with relief. "Thank you," he said. "I have been looking for that all night." He rode into the mist, whistling, and Wren heard the clop of hooves fade into the hills. A wide, low cloud drifted over the mountain. Somewhere inside it, a man was snoring so loudly the stars shook.`],
// 50
['Twenty Years in a Nap',
`Rip's Mountain was the sleepiest place in all the Book. Wren hopped across pillows of moss, bowling balls rolling in the distance, while a silver-bearded gnome snored beneath a tree. The Long Sleeper loomed over the valley like a mound of dreams, huge, soft and heavy, frozen mid-yawn. "Just one more," he mumbled, "one more minute."`,
`The Long Sleeper's yawn ended, and he woke. Twenty years had passed in a blink, and he did not know any of the faces. "I missed it," he said, with enormous sadness. "You can still be here now," Wren told him. That, it seemed, was enough. Crumb patted Quill on the head. "That is Book Five done," he said. "Half the hundred," Quill corrected. "Nearly. Remember that."`],
// 51
['The Labyrinth',
`The Labyrinth of Horns twisted in every direction, and its walls shifted when nobody was looking. Wren tied one end of a thread to a pillar and hopped across the stones, unspooling as she went. Mice with tiny chalk pieces marked the turns. At the heart of the maze the Minotaur stood frozen mid-charge, his horns lowered, his breath a cloud. He looked less angry than lost.`,
`The Minotaur's charge ended gently against a pillar, and he rubbed his head. "I was always the thing at the end of the maze," he said. "Nobody ever asked what I wanted." What he wanted, it turned out, was a window. Wren drew him one on the wall with a stub of chalk, and light poured in. The thread led out into a garden full of very quiet statues.`],
// 52
['Medusa',
`Medusa's Garden was lovely, and entirely still. Statues of heroes, deer and a rather surprised-looking pigeon stood among the flowers, every one of them a person who had looked at the wrong moment. Wren hopped across the flagstones with her eyes on the mirror-shield Quill carried. At the end of the garden Medusa stood with her face turned away, her snakes hissing softly, her voice shaking. "Don't look at me," she said. "Please."`,
`Wren did not look. She sat with her back to Medusa and told her a story instead, all about a girl in a margin who hopped through a Book. By the end the snakes were asleep, and Medusa was crying. "Nobody has ever talked to me," she whispered. The stone people began to blink. A very old, very smug ram trotted by with a golden coat, and a dragon behind him never closed its eyes.`],
// 53
['The Golden Fleece',
`The Golden Fleece Grove was a quiet place guarded by a very loud dragon. Wren hopped across tree-roots and fallen pillars while the Sleepless Dragon watched with a hundred eyes, every one of them open. A golden ram stood in a patch of sunlight, grazing, as if nothing in the world were wrong. "I never sleep," the Dragon said. "I cannot afford to."`,
`The Sleepless Dragon's eyes closed one by one, and he sank into a heap of golden light. "Thank you," he murmured. "I have been so tired." The ram let Wren take a single strand of wool, bright as a sunbeam. "Don't weave it into anything yet," he said. "It remembers where it came from." Far below, a gentle music rose from the underworld, and somebody was singing for the dead.`],
// 54
['Orpheus',
`The Underworld was quieter than the Library and more sorrowful than a lullaby. Wren hopped across the stones of a black river while shades drifted by with their heads bowed. Orpheus stood at the shore with his lyre, singing a song so sweet that stone wept. The Lord of the Dead sat on his throne, frozen at the last moment before looking back.`,
`The Lord of the Dead's gaze fell on Orpheus, and he nodded slowly. "A song," he said, "is not a thing you can keep. It is a thing you give." Orpheus bowed his head and sang to the end without once looking over his shoulder. The shades smiled. The song lifted them upward like feathers. Wren's pearl whispered, a long way away, and a wooden horse stood waiting at the gates of a city.`],
// 55
['The Wooden Horse',
`Trojan Horse Fields stretched out in the shadow of enormous walls. Wren hopped across barrels, tents and abandoned shields while sentries stood frozen in the act of yawning. In the middle of the field stood a huge wooden horse with a hatch in its belly. The Wall King stood on the battlements, his arms spread wide, shouting, "These walls will never fall!"`,
`The Wall King's voice ran out, and the walls, which had been listening, stayed exactly where they were. "Well," said the king, a little embarrassed. "They were never going to fall by themselves." The horse's hatch creaked, and a very sleepy soldier tumbled out. The gift, it turned out, was just a gift, and the war was over before breakfast. From the rocks across the sea came a lovely, terrible song.`],
// 56
['The Sirens',
`Sirens' Rocks rose from the sea like teeth. Wren hopped across waves with wax stuffed in her ears, and Crumb, who had his own wax, shouted nothing. Above the water the Siren Choir sang, a hundred voices layered like sunlight, and every ship that listened turned toward the rocks and never turned back. They were frozen on the last note.`,
`The Siren Choir let their song fade, and the sea went flat and blue. "We are only singing because it is the only thing we know how to do," said the highest voice. "Nobody ever asked us anything else." Wren pulled the wax from her ears and asked them what they would like to sing, and the answer was a lullaby. All the ships in the harbor went to sleep, and every one of them woke up smiling. Sand, bright as a coin, blew in from the south.`],
// 57
['The Pyramid',
`Pyramid Sands shimmered under three suns, one of them made of gold. Wren hopped across blocks of stone while scarabs rolled the sun in the sky. Inside the great Pyramid the Mummy King lay frozen mid-unwrapping, his bandages halfway off, one eye open, his hand reaching for a crown he had never owned.`,
`The Mummy King's bandages fell away, revealing a surprisingly young face. "I was only a boy," he said. "They told me I was a god." Wren shook her head, as gently as she could. "You were a boy," she said. "That is still good." He kept the crown. He took off the beard. The Pyramid's walls glowed with painted stories that had been waiting a very long time to be read. Somewhere deep within, a pair of scales began to tilt.`],
// 58
['The Scales',
`In the Hall of Anubis the scales were enormous, golden, and perfectly balanced. Wren hopped across hieroglyphs that shifted underfoot while jackals watched from the shadows. The Weigher of Hearts stood at the scale with a feather in one hand and a heart in the other, frozen at the instant of judgment. "Your heart is heavy," he said, in a voice like a closing door.`,
`The Weigher of Hearts placed Wren's heart on the scale, and the scale tipped lightly, lightly, and balanced. "It is lighter than a feather," he said, astonished. "You are not heavy with story yet. It has all been waiting." Wren touched the spot behind her ribs. "Then it is not too late," she said. The Weigher bowed. Reeds rustled, a boat slid by, and a lotus opened, big as a barge.`],
// 59
['The Lotus Barge',
`The Nile Lotus Barge drifted down a river of green light. Wren hopped across lilies as big as rafts while ibises waded and fish glittered like coins. The Crocodile Tyrant lay across the water, jaws open, frozen mid-snap, a king who had only ever been feared. "Snap, snap," he said, around a stuck smile.`,
`The Crocodile Tyrant closed his jaws and sank politely into the mud. "I never wanted to eat anybody," he whispered. "I wanted to be asked to dinner." The river queen laughed and set a place for him, and Crumb offered him a cookie. It was the first time Wren had seen a crocodile look shy. Up the river, in a rain of feathers, a temple opened its wide stone doors.`],
// 60
['The Feathered Serpent',
`Quetzal Temple rose in a hundred steep steps. Wren hopped from stone to stone, past jade statues and flickering torches, while the great feathered serpent coiled around the pillars, bright as a rainbow. At the top the Obsidian Jaguar crouched on the altar, his black eyes locked on the sun, his body stuck in a leap that had never landed. "The sun demands a hop," he purred.`,
`The Obsidian Jaguar landed on all four paws and bowed. "The sun does not demand anything," he admitted. "I was only afraid it would leave." The serpent unwound, and the sun came up gold and ordinary. Crumb leaned out of Wren's hat and said, very quietly, "That is Book Six done, and I think I'm getting crumbly." Wren looked down. A tiny corner of him had gone blank, like ink wiped from a page.`],
// 61
['The World Tree',
`Yggdrasil Branches stretched across nine worlds. Wren hopped from limb to limb while squirrels ferried messages up and down the trunk and an eagle watched from the crown. At the roots, the Root Gnawer chewed with terrible patience, a dragon gnawing at the foundation of the world. Every bite he took, the leaves lost a little color.`,
`The Root Gnawer stopped chewing and spat out a splinter. "I was hungry," he said. "Somebody told me endings were a kind of food." Wren caught her breath. "Who told you that?" The dragon looked suddenly very small. "A voice," he said. "With black ink in it." Crumb curled tighter. Beyond the branches, a bridge made of burning rainbow arced across the sky, and a giant stood on it.`],
// 62
['Bifrost',
`Bifrost Bridge was a rainbow with a pulse. Wren hopped across its glowing bands as the colors rippled beneath her boots. Valkyries stood guard in frozen salute, and the stars were close enough to touch. At the middle of the bridge the Giant Builder stood with a hammer the size of a house, frozen in the very instant of demanding payment. "No one crosses my bridge!" he roared, and could not stop.`,
`The Giant Builder lowered his hammer and sat on the railing, panting. "All I ever wanted was for somebody to say it was well built," he said. Wren said it was the finest bridge she had ever hopped, which was true. The giant blushed from his boots to his beard. The bridge brightened. At its end stood frozen halls of ice, where the winds were cold and the stories colder.`],
// 63
['Jotunheim',
`Jotunheim's Ice Halls glittered like a shattered window. Wren hopped across frozen pillars while icicles hung like swords and the wind howled in a hundred keys. Frost Giants stood in the great hall, each one carved of ice and frozen mid-tale. At the head of the table the Frost Giant raised a drinking horn the size of a canoe, locked in mid-toast, unable to drink or speak or stop.`,
`The Frost Giant drank at last, and a warm breath rolled out across the hall. "I was told that if the story ended, the winter would too," he said. "But the winter is not the story, little one." He wiped his beard. "It is only part of it." Crumb, who was now noticeably smaller, said that he agreed. A dark shape in the corridor shifted, chained and growling.`],
// 64
['Fenrir',
`Fenrir's Chain was forged of a cat's footstep, a woman's beard and the roots of a mountain. Wren hopped across the cold, shining links while the wolf strained against his bonds, his eyes glowing. Fenrir was enormous, and for a moment he looked more afraid than angry. "Break the chain," he rasped. "Or I will."`,
`The chain did not break. Wren sat on the wolf's great snout and told him that it was all right to be afraid, that she was afraid too, and that fear could be shared. The wolf's eyes softened. The chain, which had only ever held him because he believed in it, loosened. "There is a feast tonight," Fenrir said gruffly. "Come." Mead-light flickered in the distance, a hall with a thousand benches.`],
// 65
['Valhalla',
`Valhalla's Hall rang with every song a warrior ever sang. Wren hopped across tables and benches while mugs of mead bobbed on the wave of music. Berserkers stood frozen mid-feast, ladles raised. At the head of the hall the Draugr Lord rose from his grave, blue-white and terrible, his eyes empty. "Join the feast," he intoned. "Forever."`,
`The Draugr Lord slumped into his chair, and the empty sockets of his eyes filled with a soft light. "I was a farmer," he said. "I only wanted a good funeral." The warriors, to everyone's surprise, gave him a very good funeral. He closed his eyes at last, and the hall was quiet. Beside the water of a small lake, a hand reached out of the surface holding a sword.`],
// 66
['The Lady of the Lake',
`Excalibur Lake was perfectly still, and its mirror showed a sky full of unfamiliar stars. Wren hopped across lily pads and stepping-stones while mist curled around her ankles. A sword rose from the water, shining, its blade etched with a hundred names. The Black Knight stood at the shore in dented armor, frozen with his visor down, his sword out, barring the way.`,
`The Black Knight lifted his visor, and under it was a very tired young man. "None shall pass," he said, then paused. "Unless they have a better reason than I do." Wren gave him the best reason she had: "I want everyone's story to keep going." He stepped aside. A round table gleamed through the trees, and at it sat people who had not looked up for centuries.`],
// 67
['Round Table',
`Camelot's Round Table had no head and every seat was full. Wren hopped across turrets and banners while knights froze mid-oath. Morgana stood at the table's center in black velvet, a candle flame in her hand, frozen mid-incantation. "Camelot will fall," she said, softly, as if it were a prayer.`,
`Morgana closed her hand around the flame and let it go out. "It will fall someday," she said. "Everything does. I only wanted it to be my choice." Wren knew, then, the shape of the thing the Hush was afraid of. She did not say it out loud. The knights lifted their cups, and a bat flew in through the window with a very small, very formal invitation to a castle in the mountains.`],
// 68
['The Count',
`Transylvania Castle loomed on its peak like a cut-out of the night. Wren hopped across balconies and rafters while bats wheeled overhead, and the moon hung low and red. Count Vesper stood at the top of the great staircase with a cloak the length of a river, frozen mid-bow, a polite smile on his pale face. "I never drink… hops," he said.`,
`Count Vesper shook with laughter. "I have been waiting a very long time for a girl who could hop," he said. He had only ever wanted to hold a party where the guests lived. Wren stayed for a single waltz. The Count's cloak was soft as smoke. On the cold sea beyond the mountains a ghostly ship rocked, sails torn, searching for a harbor that did not exist.`],
// 69
['The Phantom Ship',
`The Phantom Ship drifted on fog. Its decks were slick, its masts creaked like old bones, and the ghosts of sailors stood frozen at their posts. Wren hopped across ropes and barrels while Crumb, dwindling, clung to her collar. At the wheel the Phantom Captain stared at a horizon that never came. "I sail forever," he said.`,
`The Phantom Captain let go of the wheel. For the first time in three hundred years the ship stopped. A very small, very ordinary harbor appeared in the fog, with a lamp lit in its window. "I never stopped," the Captain whispered. "I did not know I could." The ghosts walked down the gangway into the light. A long table had been set on a green lawn nearby, with a hat the size of a wheelbarrow on the nearest seat.`],
// 70
['The Tea Party',
`Wonderland Tea Party never ended, because it was always six o'clock. Wren hopped across teacups and saucers while the table stretched from horizon to horizon. A Dormouse slept in a teapot, a Hare passed the jam, and the Queen of Hearts sat at the head with a scepter and a very hot temper. "Off with her hop!" she roared.`,
`The Queen of Hearts stopped, mid-roar, because a tall shadow had stepped into the garden. He wore a coat of ink and carried a quill, and his face was kind, which was somehow the worst part. "Hello, Wren," said the Hush. "You are doing so well." Everyone froze, even the tea. "I am not your enemy," he said gently. "I am your friend. I only want everything to stay exactly the way it is." Then he was gone, and so was the tea.`],
// 71
['The Emerald Road',
`The Emerald Road was a yellow brick ribbon that wound across fields of green glass. Wren hopped from brick to brick while a scarecrow, a tin woodsman and a very frightened lion stood frozen in the middle of a song. At the end of the road the Green-Faced Witch crouched on a broomstick, her cackle stuck in the middle of a "my pretties." Wren's heart was beating very fast. The Hush had spoken to her.`,
`The Green-Faced Witch fell off her broom with a thud and sat up, blinking. "All I wanted was my sister's slippers," she said. Wren sat beside her and listened. The Scarecrow, the Woodsman and the Lion cried a little, and the road, which had been waiting for a happy ending, lit up like a ribbon of sun. Crumb wobbled. "I'm getting thin," he whispered. A spark of pixie dust landed on Wren's nose, and it smelled like the island at the end of the world.`],
// 72
['The Island of Lost Boys',
`Lost Boys Isle was a place where nobody grew up and nobody wanted to. Wren hopped across treetops and rope-bridges while pixie dust swirled through the air like sunlit snow. The island's lagoon sparkled, the fairies chimed, and the shadow of a ship drifted by. The Hook-Handed Captain stood at the end of a plank, frozen mid-gloat, his clock ticking in the belly of a crocodile somewhere nearby.`,
`The Hook-Handed Captain looked at the clock, then at Wren, and put his hook away. "I only wanted to be remembered," he said. "I was afraid of the end." Tick-tock, went the crocodile, and for once it sounded like a heartbeat. Crumb, who had been losing crumbs along the trail, said, "I think I am afraid too." Wren held him close. The next page smelled of gold coins and salt.`],
// 73
['Yo Ho',
`Pirate Cove was a bay of black rocks, bright sails and very rude parrots. Wren hopped across barrels and rigging while cannons stood silent in mid-boom. Captain Barnacle stood on the quarterdeck with a map in one fist and a bottle of rum in the other, frozen at the moment of his greatest treasure hunt. "Yarr!" he shouted. "Walk the plank!" His parrot echoed it, a second too late.`,
`Captain Barnacle unrolled his map and found the treasure on the very last fold. It was a chest full of paper, and every sheet was a story somebody had been too shy to tell. He sat down on the deck and read all night. "Well," he said at dawn, "I never knew." The pirates, charmed, voted to take up poetry. A huge shadow passed overhead with a wingspan the width of a sea.`],
// 74
['The Roc',
`Sinbad's Roc was a bird the size of an island. Wren hopped across its feathers as if they were hills while the wind whipped her hat around. Tiny ships sailed past below, and the sea was sapphire. The Roc cried out, a note so loud the clouds scattered, and then the cry hung in the air, unfinished. "SCREEEE," it said, forever.`,
`The Roc's scream finished, and the clouds gathered again. The great bird bent her head, and in her eyes Wren saw the whole sea. "I was calling for my egg," she said, softly. Wren, Crumb and Sinbad found it in a cave a hundred leagues away, and returned it, and a very small Roc hatched. Quill preened. "The egg is the best sentence in the Book," he said, "because it ends with a comma." A donkey brayed from the mouth of a cave full of gold.`],
// 75
['Open Sesame',
`Ali Baba's Cave glittered with a hundred jars and a thousand coins. Wren hopped across piles of treasure while thieves in turbans stood frozen mid-bribe. The Thieves' Chief stood at the entrance with his arm raised, the magic word on his tongue, the door half open. "Open sesame," he said, and the stone rolled aside, and stayed there.`,
`The Thieves' Chief sat on a coin-heap and sagged. "Do you know what is in the cave?" he asked. "Nothing. The word was always the treasure." Morgiana gave him tea. The thieves, in a long, serious line, apologized to the donkey. The door rolled shut as quietly as a breath. Far away, in a palace of silk and lamplight, a woman was telling a story to a king who did not want to hear it.`],
// 76
['A Story a Night',
`Scheherazade's Palace was built of candle-flames and whispered words. Wren hopped across balconies and ribbons of silk while a hundred storytellers stood frozen mid-sentence. At the palace's heart the Sultan of Silence sat on a throne of folded pages, his hand raised, forbidding anyone to speak. "No more stories," he ordered. And everything stopped.`,
`The Sultan of Silence lowered his hand, and Scheherazade, who had been waiting a thousand and one nights, said, "Once upon a time." The Sultan let her finish. He listened to the end, and then he asked for another. "Stories do not stop us from dying," she said. "They give us a reason to wait until morning." Wren held that thought in both hands like a lantern. A silk carpet floated past her window, humming.`],
// 77
['The Flying Carpet',
`Flying Carpet Skies were stitched from wind and gold thread. Wren hopped from carpet to carpet while clouds drifted below like sleeping sheep. Tassels twirled in the breeze, and the Wind Djinn spiraled around her, large as a storm, frozen in the middle of a very long whoosh. "Whoooooosh," he said, because he could not stop.`,
`The Wind Djinn finished his whoosh and fell, panting, onto a pillowy cloud. "I'm so sorry," he gasped. "I have been blowing for centuries." Wren gave him a sip of the Firebird's feather-tea, and he laughed so hard that his turban came off. Crumb had crumbled almost to a heart-shape by now. "Hang on," Wren told him. Ahead, a cold north wind rang with sleigh-bells.`],
// 78
['The Yule Beast',
`The North Pole Workshop was filled with ten thousand toys and the smell of gingerbread. Wren hopped across conveyor belts and candy-cane ladders while elves in striped stockings froze mid-hammer. The Yule Beast stood in the doorway with a sack on his back and an enormous grin, frozen in the act of deciding who was naughty. "Naughty list!" he declared.`,
`The Yule Beast tore up his naughty list and looked embarrassed. "Everyone was on it," he admitted. "I was afraid to find anyone good." Wren pulled out the red ribbon the Tin Soldier had given her and tied it around his horns, and he looked at his reflection in a bauble and laughed. Crumb grinned weakly. It was Christmas morning in the Book, and yet something about the sky looked like the last page of a letter.`],
// 79
['Egg Hollow',
`Easter Egg Hollow was a valley of painted eggs in every color of the rainbow. Wren hopped across baskets and bunny-paths while chicks chirped from the edges of cracked shells. The Rotten Egg sat at the center of the hollow, enormous, green and trembling. "Ewww," it said, as it began to crack. "Crack!" And it did not finish.`,
`The Rotten Egg cracked open, and a very small golden chick hopped out, rubbing its eyes. "I was just waiting to hatch," it said. The whole hollow laughed with relief. Wren spent a long time looking at the chick. "It seems like the right thing to do," she said. "To open, even when it is scary." Crumb put a small, brittle hand on her cheek. Pink petals blew in from the next page, and a very small arrow stuck itself in a tree.`],
// 80
['Cupid\'s Garden',
`Cupid's Garden was a place of rose-lined paths, golden arrows and the occasional unexpected kiss. Wren hopped over hedges and heart-shaped topiary while little winged babies hovered in mid-flutter. The Heartbreaker stood at the garden's center in a red coat, an arrow nocked and ready, frozen mid-shot. "Love is a battlefield," he whispered, though his face was soft.`,
`The Heartbreaker's arrow flew wide and landed in a flowerpot, where it grew into a small, stubborn rose. "I broke everyone's heart," he said, "so no one could break mine." Wren held Crumb up where he could see the roses. "Love is the reason endings hurt," she told them both. "It is also the reason they matter." The Heartbreaker nodded, and the rose bloomed. Quill, to everyone's astonishment, wiped his eye with a wing. Book Eight was finished.`],
// 81
['Moonbeam Meadows',
`Moonbeam Meadows glowed with a soft silver light. Wren hopped across mossy stones and drifting petals while moths the size of kites circled overhead. The grass was full of tiny stars, and the sky hung low enough to touch. At the center of the meadow the Eclipse waited, a circle of darkness frozen across the moon, its mouth slowly widening. "Darkness falls," it said, in a thousand voices.`,
`The Eclipse slid off the moon, and the meadow brightened. "It was only passing through," said a night fairy. "Everything passes. That is not the same as ending." Wren wrote it in the margin of her heart. A small, silver ink-drop splashed on the page above her, and a long black arm reached across the sky like a hand across a table. "Hurry," Quill whispered. "He is closer than he was."`],
// 82
['Starfall',
`Starfall Observatory was a ring of brass domes under a sky of thousands. Wren hopped across telescopes and astrolabes while meteors slid past like falling coins. The Falling Star hung in the air above the observatory, enormous and burning, frozen mid-plunge. "I fell for you," it said. It meant it as a joke, and nobody laughed.`,
`The Falling Star finished falling, very gently, onto a cushion of cloud. It turned out to be a very small, very warm sphere with a face. "I was afraid of landing," it said. Wren took it into her hands. "It is only the ground," she said. "It is a good place to stand." The star glowed brighter. Far above, a golden road wound across the morning sky, and a chariot was waiting at its end.`],
// 83
['The Sun Chariot',
`The Sun Chariot Road was paved with gold and carried by clouds. Wren hopped across the hot, bright cobbles while the horses of the sun reared in their harnesses, their manes of flame frozen mid-gallop. The Dusk Charioteer held the reins in one hand and a small black umbrella in the other. "Night is coming," he said.`,
`The Dusk Charioteer lowered his umbrella and the horses lunged forward. "Night is coming," he said again, "but so is morning. I am the one who carries it between." He gave Wren the reins for one full circuit of the sky. She whooped. Crumb whooped weakly. Below, the great whale of a cloud was drifting by, and inside it a thousand people were singing.`],
// 84
['Cloud Whales',
`Cloud Whale Kingdom was soft as a pillow and twice as deep. Wren hopped across the backs of whales that drifted through the sky like ships, spouting rain from their blowholes. Sky sailors sang chanteys from the rigging. The Thunder Squid unfurled its tentacles across the horizon, frozen mid-sneeze. "Glub glub… BOOM," it said, and held it.`,
`The Thunder Squid sneezed at last, and a rainbow shot out of its mouth. The whales cheered in long, low notes. "Much better," it gurgled. The cloud sailors gave Wren a map of the sky, drawn on a scrap of wind, and on it a tiny gear turned in a village far below. "That is the one who can mend him," said the whale queen, nodding at Crumb. "Hurry."`],
// 85
['The Clockmaker',
`The Clockwork Village ticked in perfect time, every house a little machine. Wren hopped across rotating gears and sliding platforms while tiny birds tocked from the rafters. In the town square the Clockmaker's Ghost stood in front of a giant clock with a missing hand, frozen mid-sentence. "Time is up," it said, "time is up."`,
`The Clockmaker's Ghost took the hand from the Tin Soldier's ribbon, set it into the clock, and the great gear began to turn. "Time is not up," he said. "It is only waiting." Wren set Crumb on the workbench, trembling, and the Clockmaker mended him stitch by stitch with threads of sugar and gold. He opened his eyes. "Did anyone save me a cookie?" he asked. Wren hugged him so tightly she nearly cracked him again.`],
// 86
['Mushroom Hollow',
`Mushroom Hollow glowed with spores that drifted like slow snow. Wren hopped across caps of every color while the Mushrooms hummed in a harmony of rot and rest. Toadstool witches stirred cauldrons in the shade. The Rot King lay across the clearing, a huge soft mound of mold, frozen mid-ooze. "Spore… spore… spore," it whispered.`,
`The Rot King released a cloud of spores, and the clearing filled with a thousand tiny mushrooms, each with a smile. "Everything has to go back into the ground," a little one explained, "so something new can grow." Wren knelt in the soft earth and smelled it. It smelled like beginning. The Hush's ink, she realized, never touched anything that was growing. A faint glitter shone from a cave in the next page.`],
// 87
['Crystal Caverns',
`Crystal Caverns hummed like a choir of glass bells. Wren hopped across stalagmites and crumbling gems while every crystal chimed a different note under her feet. Miner cats swung pickaxes in the dark. The Geode Golem stood in the great cavern's center, an enormous mass of rock and glittering teeth, frozen mid-crack. "Crack," it said. "Crumble."`,
`The Geode Golem split open, and inside was a cave of purple crystals so beautiful that every cat stopped to stare. "I was only hiding," said the Golem, "because it was too bright to be seen." Wren lay on her back in the amethyst light and breathed. Her heart, light as a feather, felt strangely full. Far below, the rock groaned, and a furnace of fire roared awake.`],
// 88
['The Forge',
`Lava Forge Deep rang with hammers. Rivers of molten gold poured through channels cut in stone, and sparks showered like fireworks from a hundred anvils. Wren hopped across cooling slag and drifting cinders while dwarves labored in the glow. The Magma Lord rose from the heart of the forge, enormous and incandescent, frozen mid-eruption. "Burn, little hopper!" he thundered.`,
`The Magma Lord cooled, slowly, into the shape of a very large, very friendly dwarf. "I forgot what the fire was for," he admitted. "It was for making things." The dwarves cheered, and for the rest of the night they forged lanterns for everyone. One lantern was set aside, small and gold, with a tiny hand-drawn heart on its side. "For the girl who hops," said the blacksmith. "To light the last pages."`],
// 89
['Dream Pillow Isles',
`Dream Pillow Isles floated on a sea of sleep. Wren hopped across pillows soft as clouds while dream-sheep grazed on drifting cotton. A sandman sprinkled sparkles on sleeping children from the air. The Nightmare Horse stood at the highest hill, enormous, black and frozen mid-gallop, his mane made of unfinished bad dreams. "Sweet dreams," he whispered, "not."`,
`The Nightmare Horse snorted and lowered his head. "Everyone is scared of me," he said. "But I only show you what you have not looked at yet." Wren thought about that. She looked at the dark, and said, "I think I am afraid that I am only a drawing." The Horse nodded, kindly. "Then go ask the one who drew you," he said. "He is waiting at the end."`],
// 90
['The Great Silence',
`Music Box Valley was a tiny kingdom of tin dancers and brass combs, and when Wren hopped into it, all the music stopped. The Great Silence stood in the central square, a tall, quiet shape with no face. Tin ballerinas hung mid-pirouette. Every tune in the valley had been shut inside its box. "Shhh," said the Silence, though no one had spoken.`,
`Wren took out the little silver whistle and played the first note she had ever learned. Then the second. Then Crumb joined in, off-key. Then Quill. Then every friend from every realm came, one by one, until the whole valley rang with the song they had all made. The Great Silence smiled for the first time. "Oh," it said. "That is what I was missing." The last gate of the Book stood open on a circus.`],
// 91
['Step Right Up',
`The Circus of Wonders was louder than a thunderstorm and brighter than the sun. Wren hopped across trapezes and tightropes while clowns tumbled and jugglers froze mid-throw. A calliope wheezed a waltz stuck in a single note. The Ringmaster of Doom stood in the middle ring with a whip and a top hat, frozen mid-bow. "Step right up," he said, "and FALL!"`,
`The Ringmaster of Doom took off his hat and found a little mouse asleep inside. "The show must go on," he muttered, "but not like this." He gave the mouse the center ring. The audience, finally unfrozen, roared for a full minute. In the tent's shadows Quill whispered, "Three more pages. Wren, I think there is something I should tell you about the Hush." And the lanterns went out one by one.`],
// 92
['The Haunted Manor',
`The Haunted Manor creaked with every step. Candles floated in empty halls, portraits blinked, and the floors gave way beneath Wren's hops as ghostly stairs came and went. In the grand ballroom the Manor Ghost drifted at the center, pale and translucent, frozen in the act of closing a door. "Welcome," she said. "To stay."`,
`The Manor Ghost opened the door she had been closing and stepped through it into the garden. "I forgot I could leave," she said. The house exhaled, and every portrait smiled. Quill finally cleared his throat. "The Hush was an apprentice," he said. "The youngest the Book ever had. His name was Finis. He was lonely. He drew a girl in the margin to keep him company, and she was so alive that he was afraid."`],
// 93
['Ink River',
`Ink River Delta flowed black and gold, and every wave was a word. Wren hopped across floating pages and quill-boats while the Proofreader's red pen struck out sentences along the shore. The Red Pen itself, huge and vermilion, stood on the delta, frozen mid-stroke. "Cross it out!" it shrieked.`,
`The Red Pen's stroke finished, and it crossed out only a single comma. "Better," it said, surprised. Wren sat on the bank of the Ink River and finally told Crumb what she had realized. "I think I am the girl he drew," she said. Crumb held her hand with both of his. "That is the best news I have heard all day," he said. "It means you belong to a person who loves you."`],
// 94
['Paper Kingdom',
`The Paper Kingdom was folded from a single sheet. Wren hopped across paper cranes and origami rooftops that crinkled underfoot. A paper river ran through it, a paper moon hung overhead, and every citizen was a delicate fold of white. The Scissors Giant stood at the gate, blades gleaming, frozen mid-snip. "Snip snip," it said. "Snip snip snip."`,
`The Scissors Giant put its blades together and tucked them politely behind its back. "I only cut because that is what I was made for," it said. The paper queen offered it a sheet of colored paper, and it cut her a crown. "It is a tool," Wren told them. "It can make things, too." The paper kingdom bowed. Over the hills a unicorn rose, rainbow-maned, ready to run.`],
// 95
['The Unicorn Glade',
`Unicorn Glade shimmered with magic. Rainbows arched over the trees, glitter swirled in the breeze, and the unicorns themselves tossed their silver manes in the sun. The Dark Unicorn stood on the hill, black as ink and beautiful, frozen mid-rear. "Glitter is forever," she said, and a single sparkle fell from her horn.`,
`The Dark Unicorn lowered her horn and nuzzled Wren's hand. "I am the only one who is afraid of forever," she said. "That is why I am dark." Wren held her forehead against the unicorn's neck. "I do not think forever is the problem," she said. "I think it is being alone in it." The unicorns, all of them, came to stand beside her. A griffin's cry echoed from high above.`],
// 96
['Griffin Cliffs',
`Griffin Cliffs rose in a hundred stone steps to the edge of the world. Wren hopped across ledges and gusts of wind while eagles wheeled overhead, and griffins nested in the crags. At the highest cliff the Storm Griffin stood with his wings spread wide, frozen mid-roar. "Fall from my cliffs!" he screamed. The wind did not move.`,
`The Storm Griffin's roar became a laugh. "I was only showing off," he admitted, and dipped a wing so that Wren could climb aboard. She hopped from cliff to cliff, flew a little, and landed laughing. At the top of the world a bird of ash and flame rose from a pile of cinders. "Come," it said. "We have all been waiting."`],
// 97
['Phoenix Ashes',
`Phoenix Ashes was a valley of embers, and every ember was a small hope. Wren hopped across smoldering logs and cinders while the Ash Wraith swirled in a column of grey smoke, frozen mid-howl. "Everything burns," it said, in a voice like sand. A single red feather hung in the air above its head.`,
`The Ash Wraith settled, softly, into a bed of ash. From the ash, a bird opened its eyes. "Everything burns," the Phoenix said, "and then, if it is lucky, it begins." Wren smiled, because she was beginning to understand. The ashes drifted upward and became stars. A great white mountain loomed up ahead, and its shadow was long.`],
// 98
['Yeti Pass',
`Yeti Pass was cold, narrow and very, very high. Wren hopped across ice bridges while the wind howled through the crevasses. At the summit, shy and enormous, the Abominable stood with its hands over its eyes, frozen mid-roar. "ROOOOOAR," it said, and covered its face harder.`,
`The Abominable peeked through its fingers. "Nobody ever wants to meet me," it whispered. Wren sat beside it in the snow and offered it a cookie crumb. The yeti ate it with enormous delicacy. "The last gate is beyond the pass," it said. "I will walk you to it." At the gate, the air was wet with ink, and the whole mountain trembled. A single word was written across the door: ENDINGS.`],
// 99
['Gate of Endings',
`The Gate of Endings stood between the ninety-ninth page and the hundredth. Wren hopped across periods and commas the size of boulders while ellipses flickered at her heels. Her friends from every realm walked behind her, a hundred strong, singing. The Herald of Hush floated at the gate in a cloak of blank pages, frozen mid-sentence. "THE END is near," it said.`,
