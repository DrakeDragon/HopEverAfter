`The Herald of Hush folded its cloak around itself and unfolded it into a doorway. "He is waiting for you," it said. "He has always been waiting." Wren turned to look at her friends: Crumb on her hat, Quill on her shoulder, a hundred realms at her back. "Whatever happens," she said, "nobody gets erased." And the gate swung open on a place that smelled of sugar, ink, and the first line of a story.`],
// 100
['Happily Ever After',
`The hundredth page was a castle of candy and light, with a staircase of peppermint and a sky that was a little bit of every sky. Wren hopped across it with all her friends behind her. At the top stood Finis, the Author of Endings, a tall man with ink-black fingers and a face she almost remembered. "You came," he said softly. "I drew you so you would never be lonely. I could not bear for you to end." And the last page began to turn.`,
`Wren did not fight him. She hopped, and hopped, and kept hopping, until Finis understood. A story is not safe because it stops. It is alive because it goes on. He wept, then laughed, then picked up his quill and crossed out THE END across the whole Book. In its place he wrote To be continued. "Happily ever after," Wren said, "is not where the story stops. It is where you decide to keep going." And the pages turned, softly, all one hundred of them.`]
],
epilogue:[
`The Great Book of Tales has no last page now. Finis sits in the library with Quill, proofreading, and every night he writes a new line in the margin. Crumb has a whole chapter to himself. Wren has a name that people use, and a home in every story, and a hat that fits.`,
`If you ever find a page of your own with a small girl hopping along the margin, give her a crumb. She will know what it means. Turn the page. There is always one more.`
]
};

REALMS.forEach((r,i)=>{ r.amb=r.amb||AMBS[r.id]||'dust'; r.story=NOVEL.ch[i][1]; });
if(REALMS.length!==NR) throw new Error('REALMS '+REALMS.length);
let ri = 0, RM = REALMS[0];

/* ============================== SPRITES ============================== */
const SPRC = {};
const artAtlas=new Image();artAtlas.src='assets/atlas.png';
const worldAtlas=new Image();worldAtlas.src='assets/worlds.png';
function art(g,n,x,y,w,h,hue=0){if(!artAtlas.complete||!artAtlas.naturalWidth)return false;const cw=artAtlas.width/4,ch=artAtlas.height/4;g.save();if(hue)g.filter='hue-rotate('+hue+'deg)';g.drawImage(artAtlas,n%4*cw,Math.floor(n/4)*ch,cw,ch,x,y,w,h);g.restore();return true;}
artAtlas.onload=()=>{for(const k in SPRC)delete SPRC[k];for(const k in HPREV)delete HPREV[k];if(typeof refreshMenu==='function')refreshMenu();};

function face(g,cx,cy,sc,smirk,lash){
  g.fillStyle='#2a1020';
  for(const s of [-1,1]){
    g.beginPath(); g.ellipse(cx+s*15*sc,cy-2*sc,5.5*sc,7*sc,0,0,7); g.fill();
    g.fillStyle='#fff'; g.beginPath(); g.arc(cx+s*15*sc-1.8*sc,cy-4.5*sc,2.1*sc,0,7); g.fill(); g.fillStyle='#2a1020';
    g.fillStyle='rgba(255,90,150,.55)'; g.beginPath(); g.ellipse(cx+s*25*sc,cy+10*sc,6*sc,4*sc,0,0,7); g.fill(); g.fillStyle='#2a1020';
    if(lash){ g.strokeStyle='#2a1020'; g.lineWidth=2.5*sc; g.beginPath(); g.moveTo(cx+s*15*sc+s*4*sc,cy-8*sc); g.lineTo(cx+s*15*sc+s*10*sc,cy-13*sc); g.stroke(); }
  }
  g.strokeStyle='#2a1020'; g.lineWidth=3.2*sc; g.lineCap='round'; g.beginPath();
  if(smirk){ g.moveTo(cx-9*sc,cy+11*sc); g.quadraticCurveTo(cx+2*sc,cy+21*sc,cx+11*sc,cy+8*sc); }
  else g.arc(cx,cy+7*sc,9*sc,.15*Math.PI,.85*Math.PI);
  g.stroke();
}
function drawCreature(g,t,rm){
  g.clearRect(0,0,128,128);
  if(art(g,4+Math.min(3,Math.floor(t*.67)),4,4,120,120,(rm.hue-130)*.3))return;
  const H=rm.hue;
  const hsl=[[H,62,74],[H+8,64,62],[H+18,66,54],[H+170,50,62],[H+265,58,52],[H+325,70,72]][t];
  const col=(dl,dh)=>'hsl('+mod(hsl[0]+(dh||0),360)+','+hsl[1]+'%,'+clamp(hsl[2]+dl,12,92)+'%)';
  const c1=col(14), c2=col(-16), st=col(-34);
  const gr=g.createRadialGradient(48,50,6,64,70,54); gr.addColorStop(0,c1); gr.addColorStop(1,c2);
  g.fillStyle=gr; g.beginPath(); g.arc(64,70,48,0,7); g.fill(); g.lineWidth=4; g.strokeStyle=st; g.stroke();
  // motif emoji on belly
  g.font='24px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.globalAlpha=.92;
  g.fillText(rm.emoji,64,104); g.globalAlpha=1; g.textBaseline='alphabetic';
  const acc=col(0,150), acc2='#fff7fb';
  if(t===1){ g.fillStyle=acc2; for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; g.beginPath(); g.arc(64+Math.cos(a)*40,70+Math.sin(a)*40,2.6,0,7); g.fill(); } }
  face(g,64,t>=3?72:70,1,t===4,t===5);
  if(t===2){ g.fillStyle=acc; g.beginPath(); g.moveTo(64,94); g.lineTo(44,86); g.lineTo(44,102); g.closePath(); g.fill(); g.beginPath(); g.moveTo(64,94); g.lineTo(84,86); g.lineTo(84,102); g.closePath(); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.arc(64,94,4,0,7); g.fill(); }
  if(t===3){
    const hg=g.createLinearGradient(0,22,0,60); hg.addColorStop(0,'#eef4fa'); hg.addColorStop(1,'#8a9bb0');
    g.fillStyle=hg; g.strokeStyle='#4a5a70'; g.lineWidth=3; g.beginPath(); g.arc(64,70,50,Math.PI*1.07,Math.PI*1.93); g.closePath(); g.fill(); g.stroke();
    g.fillStyle=acc; g.beginPath(); g.moveTo(54,24); g.quadraticCurveTo(64,-6,92,6); g.quadraticCurveTo(76,12,74,26); g.closePath(); g.fill();
    g.fillStyle='#4a5a70'; g.fillRect(60,40,8,12);
  } else if(t===4){
    g.fillStyle='#2c1066'; g.beginPath(); g.ellipse(64,44,52,10,0,0,7); g.fill();
    g.fillStyle='#3a1580'; g.beginPath(); g.moveTo(34,44); g.quadraticCurveTo(52,20,76,4); g.quadraticCurveTo(92,2,96,12); g.quadraticCurveTo(92,28,94,44); g.closePath(); g.fill();
    g.fillStyle=acc; g.fillRect(36,34,58,8); g.fillStyle='#ffe066'; g.beginPath(); g.arc(64,38,4.5,0,7); g.fill();
  } else if(t===5){
    const cg=g.createLinearGradient(0,14,0,48); cg.addColorStop(0,'#fff0a0'); cg.addColorStop(1,'#e8a61c');
    g.fillStyle=cg; g.strokeStyle='#8a5a00'; g.lineWidth=3;
    g.beginPath(); g.moveTo(32,46); g.lineTo(30,18); g.lineTo(48,32); g.lineTo(64,10); g.lineTo(80,32); g.lineTo(98,18); g.lineTo(96,46); g.closePath(); g.fill(); g.stroke();
    for(const [x,y,c] of [[64,30,'#19d3f0'],[44,38,'#ff3b6b'],[84,38,'#ff3b6b']]){ g.fillStyle=c; g.beginPath(); g.arc(x,y,4.2,0,7); g.fill(); }
  }
}
function getSpr(r){
  if(SPRC[r]) return SPRC[r];
  const o={c:[],u:[]};
  for(let t=0;t<6;t++){
    const c=document.createElement('canvas'); c.width=c.height=128;
    drawCreature(c.getContext('2d'),t,REALMS[r]);
    o.c.push(c); let u=''; try{ u=c.toDataURL(); }catch(e){} o.u.push(u);
  }
  SPRC[r]=o; return o;
}
function drawSprite(t,x,y,r,rot){
  const k=r/48, c=getSpr(ri).c[t];
  if(rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.drawImage(c,-64*k,-70*k,128*k,128*k); ctx.restore(); }
  else ctx.drawImage(c,x-64*k,y-70*k,128*k,128*k);
}

/* ============================== BACKGROUND ============================== */
const BG = { stars:[], decor:[], bush:[] };
function lumHex(c){ if(!c||c[0]!=='#'||c.length<7) return .3; const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255; return .2126*r+.7152*g+.0722*b; }
function computeDz(){
  const L=(lumHex(RM.sky[1])+lumHex(RM.sky[2])*2+lumHex(RM.hills[1]))/4;

function updateFx(dt){
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.l-=dt; if(p.l<=0){ fx.splice(i,1); continue; }

function computePerks(party){
  const best=party.length?Math.max.apply(null,party):-1;
  let hearts=3;
  // Friend progression improves collection and attacks, never refills health.
  const top5=party.slice(0,5);
  const sumT=top5.reduce((a,t)=>a+t,0);
  const magnet=Math.min(110,42+sumT*5);
  const power=top5.reduce((a,t)=>a+Math.pow(2,t),0);
  const E=heroEff();
  return { hearts:hearts+(E.hearts||0), magnet:Math.min(160,magnet+(E.mag||0)), power:power*(1+(E.pow||0)), best,
    inv:E.inv||0, coy:E.coy||0, buff:E.buff||0, crumb:E.crumb||0, merge:E.merge||0, shield:E.shield||0 };
}

/* ============================== LEVEL PHYSICS CHECK ============================== */
// Mirrors the real hop physics so every generated jump is guaranteed beatable.
function sim(xs,ys,vy0,speed,B,dbl,wz,pre,cutT,step){
  let x=xs,y=ys,vy=0,cutDone=!(cutT>=0); const dt=step||1/60;
  for(let a=0;a<pre;a+=dt){ vy+=G*1.22*dt; y+=vy*dt; x+=speed*dt; }
  vy=vy0; let used=false;
  for(let i=0;i<480;i++){
    const py=y;
    if(!used&&dbl>=0&&i*dt>=dbl){ vy=-JV2; used=true; if(!cutDone) cutDone=true; }
    if(!cutDone&&i*dt>=cutT){ cutDone=true; if(vy<-260) vy*=.5; }
    if(wz&&x>wz[0]&&x<wz[1]) vy-=WIND*dt;
    vy+=G*(vy>0?1.22:1)*dt; y+=vy*dt; x+=speed*dt;
    const over=x+HW>B.x&&x-HW<B.x+B.w;
    if(vy>=0&&py<=B.y+24&&y>=B.y&&over) return true;
    if(over&&y>B.y+34&&py>B.y+24&&(x+HW-B.x)<28) return false;
    if(y>B.y+330) return false;
  }
  return false;
}
const DBLS=[-1]; for(let d=.05;d<=1.01;d+=.05) DBLS.push(d);
const CUTS=[-1,.07,.11,.15,.2,.27];
function pairOK(A,B,SP,wz,step=1/30){
  const ya=[A.dy], yb=[B.dy];
  if(A.mv) ya.push(A.dy-A.mv,A.dy+A.mv);
  if(B.mv) yb.push(B.dy-B.mv,B.dy+B.mv);
  const edge=A.x+A.w;
  for(const sp of SP) for(const a of ya) for(const b of yb){
    const Bt={x:B.x,w:B.w,y:b};
    const starts = A.type==='s' ? [[A.x-HW,0],[A.x+12,0],[A.x+A.w/2,0],[edge-12,0]] : [[edge,-.05],[edge,0],[edge,.05]];
    for(const st of starts){
      let ok=false;
      for(const cu of (A.type==='s'?[-1]:CUTS)){
        for(const d of (A.type==='s'?[-1]:DBLS)){
          if(A.type==='s') ok=sim(st[0],a,-SPRING_V,sp,Bt,d,wz,0,-1,step);
          else if(st[1]<0) ok=sim(edge+st[1]*sp,a,-JV,sp,Bt,d,wz,0,cu,step);
          else ok=sim(edge,a,-JV,sp,Bt,d,wz,st[1],cu,step);
          if(ok) break;
        }
        if(ok) break;
      }
      if(!ok) return false;
    }
  }
  return true;
}

/* ============================== LEVEL GEN ============================== */
function stretchCfg(r,s){
  const T=trailsOf(r), d=(r+s/T)/NR, rr=r*.26, sf=s/(T-1)*4;
  return { r, s, d, len:Math.round(7600+sf*600+rr*180), speed0:Math.round(248+rr*3+sf*5), speed1:Math.round(318+rr*3.4+sf*6), gapMax:Math.round(170+rr*3+sf*8) };
}
function genStretch(r,s){
  const F=REALMS[r].feats, cfg=stretchCfg(r,s), R=mulberry32(7000+r*131+s*17), rr=(a,b)=>a+R()*(b-a);
  const SP=[cfg.speed0,cfg.speed1], d=cfg.d;
  const plats=[], picks=[], haz=[], winds=[];
  const mk=(x0,w,dy,type)=>({x:x0,w,dy,y:0,off:0,type:type||'n',st:false,cr:0,fall:false,vy:0,ph:R()*3,mv:type==='m'?12:0,sq:0,solid:true,mph:R()*6});
  const pick=(wx,dy,tier)=>picks.push({x:wx,y:0,dy,tier:tier||0,got:false,pull:false});
  const arc=(x0,gap,d0,d1,n,cookie,hi)=>{ for(let i=0;i<n;i++){ const t=(i+1)/(n+1); pick(x0+gap*t,lerp(d0,d1,t)-34-Math.sin(t*Math.PI)*(hi||92),(cookie&&i===Math.floor(n/2))?1:0); } };
  const line=(p,n,h)=>{ for(let i=0;i<n;i++) pick(p.x+50+i*((p.w-100)/Math.max(1,n-1)),p.dy-(h||34),0); };
  function place(gapWant,w,dyWant,type,wind){
    const prev=plats[plats.length-1]; let gap=gapWant, dy=dyWant;
    if(prev.type==='s'){gap=Math.min(gap,100);w=Math.max(w,560);dy=Math.max(dy,prev.dy-35);}
    for(let k=0;k<14;k++){
      const c=mk(prev.x+prev.w+gap,w,dy,type);
      const wz=wind?[prev.x+prev.w-10,c.x+10]:null;
      if(pairOK(prev,c,SP,wz)){ plats.push(c); return {p:c,prev,gap,wz}; }
      if(k%2===0) gap*=.9; else dy=lerp(dy,prev.dy,.4);
    }
    for(const [ww,gg] of [[Math.max(w,150),55],[Math.max(w,200),45],[Math.max(w,260),35],[Math.max(w,320),30]]){
      const c=mk(prev.x+prev.w+gg,ww,prev.dy,type);
      if(pairOK(prev,c,SP,null)){ plats.push(c); return {p:c,prev,gap:gg,wz:null}; }
    }
    for(const gg of [30,24,18,12]){
      const c=mk(prev.x+prev.w+gg,Math.max(w,340),prev.dy,'n');
      if(pairOK(prev,c,SP,null)){ plats.push(c); return {p:c,prev,gap:gg,wz:null}; }
    }
    throw new Error('No reachable platform at realm '+r+' trail '+s);
  }
  plats.push(mk(0,640,0,'n'));
  for(let i=0;i<4;i++) pick(300+i*60,-34,0);
  let gold=0;
  while(plats[plats.length-1].x+plats[plats.length-1].w<cfg.len){
    const prog=plats[plats.length-1].x/cfg.len;
    const gapBase=lerp(70,cfg.gapMax,Math.min(1,prog*1.25));
    const prev=plats[plats.length-1];
    const opts=[['run',34],['hop',24],['stairs',14],['leap',prog>.15?12:0],['spring',F.spring*80],['wind',F.updraft*80],['movers',F.mover*80],['ghosts',F.ghost*80]];
    let tot=0; for(const o of opts) tot+=o[1];
    let q=R()*tot, kind='run'; for(const o of opts){ q-=o[1]; if(q<=0){ kind=o[0]; break; } }
    if(kind==='run'){
      const res=place(rr(70,gapBase),rr(280,430),clamp(prev.dy+rr(-50,40),-110,60),'n');
      const p=res.p; arc(res.prev.x+res.prev.w,res.gap,res.prev.dy,p.dy,4,R()<.3); line(p,4,34);
      const roll=R();
      const pS=F.spike*(.7+.6*d), pW=(r>0||s>0)?F.wheel*(.4+.8*d):0, pF=F.flyer*(.5+.8*d);
      if(p.w>330&&roll<pS){
        if(r>=2&&p.w>380&&R()<.3){ const cx=p.x+p.w/2; haz.push({type:'pend',x:cx,amp:46,ph:R()*6,plat:p}); pick(cx-70,p.dy-90,0); pick(cx+70,p.dy-90,0); }
        else { const sx=p.x+rr(120,p.w-130); haz.push({type:'spike',x:sx,w:32,plat:p}); for(let i=0;i<3;i++){ const t=(i+1)/4; pick(sx-14+t*60,p.dy-52-Math.sin(t*Math.PI)*58,0); } }
      }
      else if(p.w>330&&roll<pS+pW){
        if(r>=1&&R()<.4) haz.push({type:'ball',x:p.x+p.w-30,r:14,plat:p,sp:rr(80,115),on:false,dead:false,rot:0,bt:R()*1});
        else haz.push({type:'wheel',x:p.x+p.w-30,r:17,plat:p,sp:rr(85,125),on:false,dead:false,rot:0});
      }
      else if(p.w>380&&roll<pS+pW+pF){ haz.push({type:'flyer',x:p.x+p.w-30,r:13,plat:p,sp:rr(70,105),on:false,dead:false,bob:R()*6}); }
    } else if(kind==='hop'){
      const k=3+Math.floor(R()*3);
      for(let i=0;i<k;i++){
        const crumb=R()<F.crumble*(i===0?.5:1.4);
        const res=place(rr(58,110),rr(100,140),clamp(plats[plats.length-1].dy+rr(-30,30),-110,60),crumb?'c':'n');
        arc(res.prev.x+res.prev.w,res.gap,res.prev.dy,res.p.dy,2,false); pick(res.p.x+res.p.w/2,res.p.dy-40,0);
      }
      if(R()<.12) pick(plats[plats.length-1].x+plats[plats.length-1].w/2,plats[plats.length-1].dy-105,4);
    } else if(kind==='stairs'){
      const dir=R()<.55?-1:1;
      for(let i=0;i<3;i++){
        const pv=plats[plats.length-1];
        const res=place(rr(75,120),rr(120,170),clamp(pv.dy+dir*rr(25,50),-115,60),'n');
        arc(res.prev.x+res.prev.w,res.gap,res.prev.dy,res.p.dy,3,false); line(res.p,2,34);
      }
    } else if(kind==='leap'){
      const res=place(rr(gapBase*.8,gapBase),rr(210,280),clamp(prev.dy+rr(-40,20),-100,50),'n');
      arc(res.prev.x+res.prev.w,res.gap,res.prev.dy,res.p.dy,6,true); line(res.p,3,34);
      if(R()<.22) pick(res.prev.x+res.prev.w+res.gap/2,Math.min(res.prev.dy,res.p.dy)-125,4);
      if(gold<2&&R()<.5){ pick(res.prev.x+res.prev.w+res.gap/2,Math.min(res.prev.dy,res.p.dy)-170,2); gold++; }
    } else if(kind==='spring'){
      const a=place(rr(70,120),rr(96,120),clamp(prev.dy+rr(-30,30),-70,40),'n');
      const sp=a.p; sp.type='s';
      // re-validate: landing pad must be reachable from the previous platform as a normal platform (type only matters as A)
      arc(a.prev.x+a.prev.w,a.gap,a.prev.dy,sp.dy,3,false);
      const b=place(rr(110,200),rr(220,300),clamp(sp.dy+rr(-70,10),-110,50),'n');
      for(let i=1;i<=3;i++) pick(sp.x+sp.w/2+i*30,sp.dy-90-i*70,i===2?1:0);
      arc(b.prev.x+b.prev.w,b.gap,b.prev.dy-120,b.p.dy,3,false); line(b.p,3,34);
    } else if(kind==='wind'){
      const res=place(rr(210,300),rr(240,320),clamp(prev.dy+rr(-40,20),-100,50),'n',true);
      if(res.wz&&res.gap>150){ winds.push({x0:res.wz[0],x1:res.wz[1]}); arc(res.prev.x+res.prev.w,res.gap,res.prev.dy-80,res.p.dy-120,6,true,150); }
      else arc(res.prev.x+res.prev.w,res.gap,res.prev.dy,res.p.dy,3,false);
      line(res.p,3,34);
    } else if(kind==='movers'){
      const n=2+Math.floor(R()*2);
      for(let i=0;i<n;i++){
        const pv=plats[plats.length-1];
        const res=place(rr(75,115),rr(110,150),clamp(pv.dy+rr(-30,30),-90,40),'m');
        arc(res.prev.x+res.prev.w,res.gap,res.prev.dy-(res.prev.mv?0:0),res.p.dy,2,false); pick(res.p.x+res.p.w/2,res.p.dy-90,0);
      }
      const res=place(rr(75,115),rr(230,300),clamp(plats[plats.length-1].dy+rr(-30,30),-100,50),'n'); line(res.p,3,34);
    } else if(kind==='ghosts'){
      const n=3+Math.floor(R()*2);
      for(let i=0;i<n;i++){
        const pv=plats[plats.length-1];
        const res=place(rr(60,105),rr(100,140),clamp(pv.dy+rr(-25,25),-100,40),'g');
        arc(res.prev.x+res.prev.w,res.gap,res.prev.dy,res.p.dy,2,false); pick(res.p.x+res.p.w/2,res.p.dy-42,0);
      }
      const res=place(rr(60,105),rr(230,300),clamp(plats[plats.length-1].dy+rr(-25,25),-100,50),'n'); line(res.p,3,34);
    }
  }
  const lastp=plats[plats.length-1];
  const fin=place(110,1100,0,'n'); arc(fin.prev.x+fin.prev.w,fin.gap,fin.prev.dy,0,3,false);
  if(gold<1) pick(plats[Math.floor(plats.length/2)].x+30,-150,2);
  let secret=null;
  if((r+s)%3===0){
    for(let i=Math.floor(plats.length*.2);i<plats.length*.55&&!secret;i++){
      const p=plats[i];
      if(p.type!=='n'||p.w<300||haz.some(z=>z.plat===p)) continue;
      for(let j=i+2;j<plats.length-3;j++){ const q=plats[j];
        if(q.x>p.x+p.w/2+1600&&q.type==='n'&&q.w>=260&&!haz.some(z=>z.plat===q)){ secret={x:p.x+p.w*.55,dy:p.dy-210,y:0,got:false,lp:q,lx:q.x+70}; break; } }
    }
  }
  return {plats,picks,haz,winds,secret};
}

function updateHop(dt){
  const h=H.hero; H.time+=dt; if(H.shake>0) H.shake-=dt;
  const boss=H.kind==='boss';
  if(H.state==='dead'){ H.deadT+=dt; updateFx(dt); return; }
  if(H.state==='won'){
    H.wonT+=dt; updateFx(dt);
    if(H.wonT>.1&&Math.random()<.5) spark(H.bossX+rnd(-40,40),groundY-rnd(40,170),3,['#ff2fb3','#19d3f0','#ffe066'][Math.floor(Math.random()*3)],200,.8,4);
    if(H.wonT>2.2&&!H.shown){ H.shown=true; if(H.mini) miniWon(); else showVictory(); }
    return;
  }
  for(const bk of ['magnet','star','dbl']) if(H.buffs[bk]>0) H.buffs[bk]-=dt;
  const speed=boss?150:lerp(H.cfg.speed0,H.cfg.speed1,clamp(h.x/H.len,0,1));
  const prevY=h.y;
  h.x+=speed*dt; h.anim+=dt; h.hitAnim=Math.max(0,(h.hitAnim||0)-dt);
  if(h.inv>0) h.inv-=dt;
  h.sq*=(1-Math.min(1,dt*11));
  // moving / ghost platforms
  for(const p of H.plats){
    if(p.type==='m') p.off=12*Math.sin(H.time*1.3+p.mph);
    else if(p.type==='g'){p.solid=!p.fall;p.warn=!!p.st;}
  }
  if(h.buf>0){ h.buf-=dt; if(h.on||h.coy>0){ h.buf=0; doJump(); } }
  if(!boss&&H.winds.length&&!h.on){ for(const w of H.winds){ if(h.x>w.x0&&h.x<w.x1){ h.vy-=WIND*dt; break; } } }
  h.vy+=G*(h.vy>0?1.22:1)*dt;
  h.y+=h.vy*dt;
  let landed=false, lp=null;
  for(const p of H.plats){
    if(p.fall||(p.type==='g'&&!p.solid)) continue;
    const px=p.x, pr=p.x+p.w, py=platY(p);
    if(h.x+HW>px&&h.x-HW<pr){
      if(h.vy>=0&&prevY<=py+24&&h.y>=py){ h.y=py; h.vy=0; landed=true; lp=p; break; }
      
    }
  }
  if(landed&&lp.type==='s'){
    h.vy=-SPRING_V; landed=false; h.on=false; h.coy=0; h.jumps=1; h.cut=true; lp.sq=.3;
    sfx.spring(); spark(h.x,h.y,10,'#ffffff',140,.4,3); ringFx(h.x,h.y-10,'#ffe066');
  }
  if(landed){
    if(!boss&&lp.type==='n'&&lp.w>HW*2+10){H.safePlat=lp;H.safeX=clamp(h.x,lp.x+HW+4,lp.x+lp.w-HW-4);}
    if(!h.on){ sfx.land(); h.sq=.28; spark(h.x,h.y,6,'#fff3fa',110,.3,2.5); }
    h.on=true; h.coy=.1+(perks.coy||0); h.jumps=0;
    if((lp.type==='c'||lp.type==='g')&&!lp.st){lp.st=true;lp.cr=lp.type==='g'?.9:.55;}
  } else {
    h.on=false; h.coy-=dt;
    if(h.coy<=0&&h.jumps===0) h.jumps=1;
  }
  for(const p of H.plats){
    if(p.sq>0) p.sq-=dt;
    if(p.st&&!p.fall){ p.cr-=dt; if(p.cr<=0){ p.fall=true; p.vy=0; } }
    if(p.fall){ p.vy+=1700*dt; p.off+=p.vy*dt; }
  }
  const fellY=Math.min(groundY+235,LH+20);
  if(!boss&&h.y>fellY&&H.state==='play'){
    fallOut(); updateFx(dt); updateHUD(); return;
  }
  H.hist.push(h.y); if(H.hist.length>140) H.hist.shift();
  H.camX=h.x-heroSX;
  H.comboT-=dt; if(H.comboT<=0) H.combo=0;
  if(!boss){
    const hx=h.x, hy=h.y-26, mag=perks.magnet+(H.buffs.magnet>0?130:0), hx_=h.x;
    for(const k of H.picks){
      if(k.got) continue;
      if(k.x<H.camX-60||k.x>H.camX+LW+200){ if(!k.pull) k.y=groundY+k.dy; continue; }
      if(!k.pull) k.y=groundY+k.dy+Math.sin(H.time*4+k.x*.05)*3;
      const dx=hx-k.x, dy=hy-k.y, dd=Math.sqrt(dx*dx+dy*dy);
      if(dd<mag){ k.pull=true; const f=Math.min(1,dt*(9+(mag-dd)*.05)); k.x+=dx*f; k.y+=dy*f; }
      if(dd<24) collect(k);
    }
    if(H.flash>0) H.flash-=dt;
    const scr=H.secret;
    if(scr&&!scr.got&&H.state==='play'){
      scr.y=groundY+scr.dy+Math.sin(H.time*3)*4;
      const dxs=hx_-scr.x, dys=hy-scr.y, dds=Math.sqrt(dxs*dxs+dys*dys);
      if(dds<Math.max(32,mag*.8)) doWarp();

    for(const z of H.haz){
      const py=platY(z.plat);
      if(z.type==='spike'){
        if(h.inv<=0&&h.x+HW-3>z.x&&h.x-HW+3<z.x+z.w&&h.y>py-24&&h.y-HH<py) hurt();
      } else if(z.type==='pend'){

      } else if(z.type==='wheel'||z.type==='flyer'||z.type==='ball'){
        if(z.dead) continue;

        if(z.on){
          z.x-=z.sp*dt;
          if(z.type!=='flyer') z.rot-=z.sp*dt/z.r;
          if(z.x<z.plat.x+14){ z.dead=true; spark(z.x,py-(z.type==='flyer'?88:z.r),10,'#ff3b6b',140,.4,3); }
        }
        const cy=z.type==='wheel'?py-z.r:z.type==='ball'?ballY(z):py-88+Math.sin(H.time*3+z.bob)*8;
        const ddx=h.x-z.x, ddy=(h.y-24)-cy, rr2=z.r+11;
        if(z.on&&ddx*ddx+ddy*ddy<rr2*rr2){
          if(H.buffs.star>0){ z.dead=true; spark(z.x,cy,16,'#ffe066',220,.5,4); popText(z.x,cy-20,'SMASH!','#ffe066',17); sfx.zap(); }
          else if(h.inv<=0) hurt();
        }
      }
    }
    if(H.state==='play'&&h.on&&h.x>=H.endX){ H.state='end'; H.endT=0; awardStars(8+Math.floor(H.collected.length/12)); sfx.win(); spark(h.x,h.y-30,30,'#ffe066',240,.9,4); popText(h.x,h.y-90,H.idx===trailsOf(ri)-1?'BOSS AHEAD!':(H.idx===miniAfter(ri)?'MINI-BOSS AHEAD!':'TRAIL CLEARED!'),'#19d3f0',24); }
    if(H.state==='end'){ H.endT+=dt; if(H.endT>1.05&&!H.fadeStart){ H.fadeStart=true; const nx=H.idx; fadeTo(()=>{ if(nx===miniAfter(ri)) startBoss(false,true); else if(nx<trailsOf(ri)-1) startHop(nx+1); else startBoss(false); }); } }
  } else updateBoss(dt);
  updateFx(dt);
  updateHUD();
}

function bossPattern(){
  const ph=H.phase, W=H.boss.waves;

        : ph===2 ? [['F','B'],['B','F'],['F','F'],['F'],['B']].concat(W?[['W','F'],['F','W'],['W']]:[])
        : [['F','B','F'],['F','F','B'],['B','F'],['F','F','F'],['B','B']].concat(W?[['W','F','B'],['F','W','F'],['W','W']]:[]);
  const pat=P[Math.floor(Math.random()*P.length)];
  const hasW=pat.indexOf('W')>=0;
  const step=hasW?1.6:(ph===1?.95:ph===2?1:1.05);
  let t=0;
  for(const ty of pat){ H.queue.push({at:H.time+t,type:ty}); t+=step; }

  for(let xx=Math.floor((x0+camX)/74)*74;xx<x1+camX;xx+=74){

  }

function drawHouse(x,y){
  ctx.save(); ctx.translate(x,y);
  const P=RM.plat;
  ctx.fillStyle=P.b1; ctx.fillRect(-70,-100,140,100);
  ctx.fillStyle='rgba(0,0,0,.25)'; for(let i=0;i<7;i++) ctx.fillRect(-70,-100+i*15,140,2);
  ctx.fillStyle=P.top; ctx.beginPath(); ctx.moveTo(-86,-96); ctx.lineTo(0,-168); ctx.lineTo(86,-96); ctx.closePath(); ctx.fill();
  ctx.fillStyle=P.rim; for(let i=0;i<9;i++){ ctx.beginPath(); ctx.arc(-80+i*20,-98,10,0,Math.PI); ctx.fill(); }
  ctx.fillStyle='#ffe066'; ctx.fillRect(-52,-76,30,30); ctx.fillRect(22,-76,30,30);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(-52,-62,30,3); ctx.fillRect(37,-76,3,30);
  ctx.fillStyle='rgba(0,0,0,.5)'; ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(-14,-44); ctx.arc(0,-44,14,Math.PI,0); ctx.lineTo(14,0); ctx.fill();
  ctx.restore();

function drawProj(p,camX,B){
  const sx=p.x-camX, c=B.proj;
  if(p.type==='F'){
    const g=ctx.createRadialGradient(sx,groundY-18,2,sx,groundY-18,26); g.addColorStop(0,c[0]); g.addColorStop(.4,c[1]); g.addColorStop(1,'rgba(255,60,80,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,groundY-18,26,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sx,groundY-18,8,0,7); ctx.fill();

    ctx.save(); ctx.translate(sx,groundY-94);

function renderHop(){
  const camX=H.camX, boss=H.kind==='boss';
  ctx.save();
  if(H.shake>0) ctx.translate((Math.random()-.5)*8*H.shake*3,(Math.random()-.5)*8*H.shake*3);
  drawBackground(camX,H.time);
  drawSyrup(H.time);
  if(boss&&H.boss.kind==='caster'&&ri===0) drawHouse(H.bossX+34,groundY);
  if(!boss) drawWinds(camX);
  for(const p of H.plats) drawPlat(p,camX);
  if(!boss){
    const ep=H.plats[H.plats.length-1];
    drawGate(ep.x+300-camX,ep.y,H.idx===trailsOf(ri)-1?'BOSS GATE':(H.idx===miniAfter(ri)?'MINI-BOSS':'NEXT TRAIL'));
    for(const z of H.haz){ if(z.type==='spike') drawSpike(z,camX); else if(z.type==='wheel') drawWheel(z,camX); else if(z.type==='ball') drawBall(z,camX); else if(z.type==='pend') drawPend(z,camX); else drawFlyer(z,camX); }
    for(const k of H.picks) drawPickup(k,camX);
    if(H.secret&&!H.secret.got) drawSecret(H.secret,camX);
  } else {
    const wonT=H.state==='won'?H.wonT:0;
    const fk=H.state==='won'?Math.max(0,1-wonT/1.8):1, sc=fk*(H.mini?.74:1);
    if(fk>0) drawBoss(H.boss,H.bossX,groundY,H.time,H.flinch,sc,fk,wonT*3);
    for(const p of H.proj) drawProj(p,camX,H.boss);
  }
  drawFollowers();
  if(H.buffs&&H.state!=='dead'){
    const hy=H.hero.y-28;
    if(H.buffs.star>0){ const g=ctx.createRadialGradient(heroSX,hy,6,heroSX,hy,54); const c=Math.floor(H.time*360)%360; g.addColorStop(0,'hsla('+c+',100%,70%,.55)'); g.addColorStop(1,'hsla('+c+',100%,70%,0)'); ctx.fillStyle=g; ctx.fillRect(heroSX-56,hy-56,112,112); }
    if(H.buffs.shield>0){ ctx.strokeStyle='rgba(120,235,255,.9)'; ctx.fillStyle='rgba(120,235,255,.18)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(heroSX,hy,34+Math.sin(H.time*6)*1.5,0,7); ctx.fill(); ctx.stroke(); }
    if(H.buffs.magnet>0){ ctx.strokeStyle='rgba(255,120,220,.5)'; ctx.lineWidth=2; ctx.setLineDash([6,8]); ctx.lineDashOffset=-H.time*30; ctx.beginPath(); ctx.arc(heroSX,hy,perks.magnet+130>150?150:perks.magnet+130,0,7); ctx.stroke(); ctx.setLineDash([]); }
  }
  if(H.state!=='dead'||H.deadT<.15) drawHero(heroSX,H.hero.y,H.hero.anim,!H.hero.on,H.hero.vy,H.hero.sq,H.hero.inv);
  else drawHero(heroSX,H.hero.y,H.hero.anim,true,0,0,0);
  drawFx(camX);
  if(H.flash>0){ ctx.fillStyle='rgba(255,240,200,'+Math.min(.8,H.flash*2.2)+')'; ctx.fillRect(0,0,LW,LH); }
  ctx.restore();
}
function renderMenu(t){
  drawBackground(t*60,t);
  const g=ctx.createLinearGradient(0,LH*.6,0,LH); g.addColorStop(0,'rgba(10,3,24,0)'); g.addColorStop(1,'rgba(10,3,24,.6)'); ctx.fillStyle=g; ctx.fillRect(0,LH*.6,LW,LH*.4);
}

/* ============================== MAIN LOOP ============================== */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-last)/1000; if(!(dt>0)) dt=.016; dt=Math.min(dt,1/30); last=ts;
  game.t+=dt;
  ctx.setTransform(S,0,0,S,0,0); ctx.globalAlpha=1;
  if((game.mode==='hop'||game.mode==='boss')&&H){ updateHop(dt); renderHop(); }
  else renderMenu(game.t);
}

/* ============================== BOOT ============================== */
// Menu backdrop cycles to the furthest-unlocked realm so the title screen reflects progress.
ri=Math.min(firstOpen(),NR-1); RM=REALMS[ri]; initBG(); getSpr(ri);
